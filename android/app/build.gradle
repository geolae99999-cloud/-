plugins {
    id 'com.android.application'
}

// 서명 정보는 저장소 밖 파일에서 읽어요 (VOCAPRO_KEYSTORE_PROPS 또는 C:/Users/<나>/Android/vocapro-signing/keystore.properties).
def ksFile = new File(System.getenv('VOCAPRO_KEYSTORE_PROPS') ?: (System.getProperty('user.home') + '/Android/vocapro-signing/keystore.properties'))
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'kr.kro.vocapro'
    compileSdk 36

    // 구글 플레이: 2026-08-31부터 새 앱과 업데이트는 Android 16(API 36) 이상을 대상으로 해야 올릴 수 있어요.
    // 업데이트를 올릴 때마다 versionCode 를 1씩 올려요.
    defaultConfig {
        applicationId 'kr.kro.vocapro'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
