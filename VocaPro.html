<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3a5bff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="VocaPro">
  <meta name="description" content="단어, 끝까지 외우다 — VocaPro 영단어 학습">
  <title>VocaPro - 스마트 단어 마스터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --bg: #f2f4fb; --surface: #ffffff; --surface-2: #eceff8; --ink: #17213f; --muted: #76809c; --line: #e3e8f4;
      --blue: #3a5bff; --blue-ink: #2744d8; --blue-soft: #e6ebff;
      --sun: #ffcf3f; --sun-soft: #fff4cc;
      --mint: #14b890; --mint-soft: #d9f6ee;
      --coral: #ff5a68; --coral-soft: #ffe3e6;
      --shadow: 0 8px 24px rgba(40, 60, 140, 0.08);
      --shadow-up: 0 -8px 30px rgba(40, 60, 140, 0.12);
      --serif: 'Fraunces', 'Pretendard Variable', Georgia, serif;
    }
    body.dark {
      --bg: #0d1224; --surface: #171e38; --surface-2: #202947; --ink: #eef1ff; --muted: #8f9abf; --line: #26305a;
      --blue: #6f8aff; --blue-ink: #9fb1ff; --blue-soft: #1c2656;
      --sun: #ffd24d; --sun-soft: #3b3213;
      --mint: #2fd3ac; --mint-soft: #0f3b34;
      --coral: #ff7480; --coral-soft: #44212b;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --shadow-up: 0 -8px 30px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body {
      font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: var(--bg); color: var(--ink); max-width: 480px; margin: 0 auto; min-height: 100vh;
      padding-bottom: calc(86px + env(safe-area-inset-bottom)); transition: background .2s, color .2s; line-height: 1.45;
    }
    body.no-scroll { overflow: hidden; }
    @media (min-width: 481px) { body { box-shadow: 0 0 0 1px var(--line), 0 0 60px rgba(40, 60, 140, .08); } }
    button, input, select, textarea { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

    /* ---------- 헤더 ---------- */
    .app-header { position: sticky; top: 0; z-index: 40; background: var(--bg); padding: 14px 18px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand b { color: var(--blue); font-weight: 800; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .by { font-size: .7rem; font-weight: 700; color: var(--muted); }
    .round-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--surface); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; font-size: 1.05rem; flex-shrink: 0; }

    .view-pane { padding: 6px 16px 16px; display: none; }
    .view-pane.active { display: block; }
    .page-title { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.04em; margin: 4px 2px 14px; }
    .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 2px 10px; font-size: 1.05rem; font-weight: 800; letter-spacing: -0.03em; }
    .section-title button { background: none; border: none; font-size: .82rem; font-weight: 700; color: var(--blue); }

    /* ---------- 공통 컴포넌트 ---------- */
    .btn { border: none; border-radius: 999px; padding: 13px 20px; font-size: .95rem; font-weight: 700; transition: transform .12s, opacity .12s; white-space: nowrap; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-soft { background: var(--surface-2); color: var(--ink); }
    .btn-ok { background: var(--mint); color: #fff; }
    .btn-bad { background: var(--coral); color: #fff; }
    .btn-block { width: 100%; }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    input[type="text"], input[type="password"], select, textarea {
      width: 100%; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 14px; font-size: .95rem; background: var(--surface); outline: none;
    }
    textarea { resize: vertical; min-height: 130px; line-height: 1.5; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); }
    .card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; }
    .muted { color: var(--muted); }
    .badge { display: inline-block; font-size: .68rem; font-weight: 800; padding: 3px 8px; border-radius: 8px; vertical-align: middle; }
    .b-new { background: var(--surface-2); color: var(--muted); }
    .b-learn { background: var(--blue-soft); color: var(--blue-ink); }
    .b-ok { background: var(--mint-soft); color: var(--mint); }
    .b-bad { background: var(--coral-soft); color: var(--coral); }
    .empty { text-align: center; color: var(--muted); padding: 44px 12px; font-size: .92rem; line-height: 1.7; }
    .empty b { display: block; color: var(--ink); font-size: 1rem; margin-bottom: 2px; }

    /* ---------- 홈: 카드 더미 히어로 ---------- */
    .deck { position: relative; margin: 6px 6px 40px; }
    .deck-card { border-radius: 28px; background: var(--blue); }
    .deck-3, .deck-2 { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
    .deck-3 { transform: translateY(20px) scale(.88); opacity: .3; }
    .deck-2 { transform: translateY(10px) scale(.94); opacity: .55; }
    .deck-1 { position: relative; color: #fff; padding: 22px 20px 20px; box-shadow: 0 16px 34px rgba(58, 91, 255, .32); }
    .deck-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .deck-label { font-size: .9rem; font-weight: 700; opacity: .85; }
    .deck-num { font-size: 3.1rem; font-weight: 800; letter-spacing: -0.05em; line-height: 1.05; margin-top: 2px; }
    .deck-num small { font-size: 1.1rem; font-weight: 700; margin-left: 4px; opacity: .85; letter-spacing: 0; }
    .deck-sub { font-size: .86rem; opacity: .85; margin: 6px 0 16px; max-width: 24ch; }
    .deck-cta { background: #fff; color: var(--blue-ink); border: none; border-radius: 999px; padding: 13px 22px; font-size: .95rem; font-weight: 800; }
    .deck-cta:active { transform: scale(.97); }
    .ring-box { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
    .ring { width: 84px; height: 84px; }
    .ring-bg { fill: none; stroke: rgba(255, 255, 255, .25); stroke-width: 8; }
    .ring-fg { fill: none; stroke: #fff; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .6s; }
    .ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .72rem; font-weight: 700; line-height: 1.15; }
    .ring-txt b { font-size: 1.1rem; font-weight: 800; }

    .streak-card { display: flex; align-items: center; gap: 14px; }
    .streak-fire { font-size: 2rem; }
    .streak-n { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.03em; }
    .week { display: flex; justify-content: space-between; flex: 1; gap: 4px; }
    .day { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: .7rem; font-weight: 700; color: var(--muted); }
    .day i { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: .75rem; color: #fff; }
    .day.done i { background: var(--sun); color: #5a4300; }
    .day.today { color: var(--ink); }
    .day.today i { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--blue); }

    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { text-align: left; border: none; background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
    .tile:active { transform: scale(.98); }
    .tile-ico { width: 40px; height: 40px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
    .tile-name { font-weight: 700; font-size: .95rem; }
    .tile-n { font-size: .8rem; color: var(--muted); font-weight: 600; }
    .t-sprout { background: var(--mint-soft); }
    .t-wrong { background: var(--coral-soft); }
    .t-star { background: var(--sun-soft); }
    .t-ear { background: var(--blue-soft); }

    /* ---------- 단어장 ---------- */
    .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .add-row .btn { padding: 0 18px; }
    .book-list { display: flex; flex-direction: column; gap: 10px; }
    .book { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 16px 16px 20px; position: relative; overflow: hidden; cursor: pointer; }
    .book::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 5px; border-radius: 0 5px 5px 0; background: var(--bk, var(--blue)); }
    .book-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .book-name { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.03em; word-break: break-word; }
    .book-meta { font-size: .78rem; color: var(--muted); font-weight: 600; margin: 3px 0 10px; }
    .bar { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--mint); border-radius: 99px; transition: width .4s; }

    .book-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .sum-box { background: var(--surface); border-radius: 16px; padding: 12px; text-align: center; box-shadow: var(--shadow); }
    .sum-box b { display: block; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.03em; }
    .sum-box span { font-size: .72rem; color: var(--muted); font-weight: 600; }
    .book-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .book-actions .btn { padding: 12px 6px; font-size: .85rem; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
    .toolbar input { flex: 1; min-width: 0; }
    .icon-btn { width: 46px; border: none; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); font-size: 1.05rem; flex-shrink: 0; }
    .icon-btn.on { background: var(--coral-soft); }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { border: none; background: var(--surface); color: var(--muted); border-radius: 999px; padding: 8px 14px; font-size: .8rem; font-weight: 700; white-space: nowrap; box-shadow: var(--shadow); }
    .chip.on { background: var(--ink); color: var(--bg); }

    .word-list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 70px; }
    .wcard { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 14px 14px 10px; }
    .wcard.mastered { opacity: .72; }
    .w-row { display: flex; align-items: flex-start; gap: 4px; }
    .w-star { background: none; border: none; font-size: 1.25rem; padding: 2px 6px; color: var(--line); line-height: 1; }
    .w-star.on { color: var(--sun); }
    .w-main { flex: 1; min-width: 0; cursor: pointer; }
    .w-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
    .w-word { font-family: var(--serif); font-size: 1.3rem; font-weight: 700; letter-spacing: -0.01em; word-break: break-word; }
    .w-pron { font-size: .8rem; color: var(--muted); font-weight: 600; }
    .w-kpron { font-size: .8rem; color: var(--blue-ink); font-weight: 700; }
    .w-mean { font-size: 1rem; font-weight: 600; margin-top: 3px; transition: filter .15s; }
    .w-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .w-speak { background: var(--blue-soft); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1rem; }
    .w-badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    body.hide-content .w-mean:not(.reveal) { filter: blur(7px); }
    .w-detail { margin: 12px 0 0 6px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: .88rem; display: flex; flex-direction: column; gap: 10px; }
    .w-detail h4 { font-size: .76rem; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
    .syn-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .syn { background: var(--blue-soft); color: var(--blue-ink); border: none; border-radius: 10px; padding: 5px 10px; font-size: .8rem; font-weight: 700; }
    .w-tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .w-tools .btn { padding: 9px 14px; font-size: .8rem; }
    .note-box { background: var(--surface-2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; line-height: 1.55; }
    .note-box ul { padding-left: 18px; }
    .fab { position: fixed; bottom: calc(92px + env(safe-area-inset-bottom)); right: max(16px, calc(50% - 224px)); width: 58px; height: 58px; border-radius: 50%; border: none; background: var(--blue); color: #fff; font-size: 1.8rem; box-shadow: 0 12px 26px rgba(58, 91, 255, .4); z-index: 30; line-height: 1; }
    .fab:active { transform: scale(.94); }

    /* ---------- 학습 탭 ---------- */
    .src-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; scrollbar-width: none; }
    .src-row::-webkit-scrollbar { display: none; }
    .src { flex-shrink: 0; border: 2px solid transparent; background: var(--surface); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 86px; }
    .src span { font-size: .8rem; font-weight: 700; color: var(--muted); white-space: nowrap; max-width: 12ch; overflow: hidden; text-overflow: ellipsis; }
    .src b { font-size: 1.15rem; font-weight: 800; }
    .src.on { border-color: var(--blue); background: var(--blue-soft); }
    .src.on span { color: var(--blue-ink); }
    .seg { display: flex; background: var(--surface-2); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 4px; }
    .seg button { flex: 1; border: none; background: transparent; padding: 9px 4px; border-radius: 11px; font-size: .84rem; font-weight: 700; color: var(--muted); }
    .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 2px 8px rgba(40, 60, 140, .12); }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mode { text-align: left; border: none; background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
    .mode:active { transform: scale(.98); }
    .mode .ico { font-size: 1.6rem; margin-bottom: 4px; }
    .mode b { font-size: .98rem; font-weight: 800; letter-spacing: -0.02em; }
    .mode span { font-size: .78rem; color: var(--muted); }

    /* ---------- 학습 화면(오버레이) ---------- */
    .study-screen { position: fixed; top: 0; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--bg); z-index: 150; display: none; flex-direction: column; padding-top: env(safe-area-inset-top); }
    .study-screen.open { display: flex; }
    .study-top { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
    .study-top .x { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--surface); box-shadow: var(--shadow); font-size: 1rem; flex-shrink: 0; }
    .prog { flex: 1; height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .prog i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .3s; }
    .st-count { font-size: .82rem; font-weight: 700; color: var(--muted); min-width: 42px; text-align: right; }
    #stBody { flex: 1; overflow-y: auto; padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); }
    .q-wrap { display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
    .q-card { background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); padding: 30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .q-label { font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .q-word { font-family: var(--serif); font-size: 2.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; word-break: break-word; }
    .q-pron { font-size: 1rem; color: var(--blue-ink); font-weight: 700; }
    .q-meaning { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; }
    .q-sub { font-size: .85rem; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .q-hint { font-family: var(--serif); font-size: 1.4rem; letter-spacing: .12em; color: var(--muted); margin-top: 6px; }
    .q-speak { margin-top: 8px; width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--blue-soft); font-size: 1.3rem; }
    .q-speak.big { width: 92px; height: 92px; font-size: 2.4rem; }
    .opts { display: flex; flex-direction: column; gap: 10px; }
    .opt { display: flex; align-items: center; gap: 12px; text-align: left; border: 2px solid transparent; background: var(--surface); border-radius: 18px; padding: 15px 16px; font-size: 1rem; font-weight: 700; box-shadow: var(--shadow); }
    .opt:active { transform: scale(.985); }
    .opt-n { width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--muted); font-size: .78rem; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .opt:disabled { cursor: default; }
    .opt.correct { background: var(--mint-soft); border-color: var(--mint); }
    .opt.wrong { background: var(--coral-soft); border-color: var(--coral); }
    .type-input { font-family: var(--serif); text-align: center; font-size: 1.5rem; padding: 16px; border-radius: 18px; }
    .fb { border-radius: 16px; padding: 14px 16px; font-weight: 700; line-height: 1.5; }
    .fb.ok { background: var(--mint-soft); color: var(--mint); }
    .fb.bad { background: var(--coral-soft); color: var(--coral); }
    .fb b { font-family: var(--serif); font-size: 1.15rem; }
    .fb-sub { font-size: .85rem; font-weight: 500; color: var(--ink); margin-top: 4px; }
    .q-foot { margin-top: auto; }

    .sw-hint { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 700; padding: 0 6px; }
    .sw-hint .no { color: var(--coral); }
    .sw-hint .ok { color: var(--mint); }
    .swipe-area { flex: 1; display: flex; align-items: center; min-height: 340px; }
    .swipe-wrap { position: relative; width: 100%; height: 360px; perspective: 1100px; -webkit-perspective: 1100px; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
    .fc-card-3d { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.4, .2, .2, 1); -webkit-transform-style: preserve-3d; transform-style: preserve-3d; }
    .fc-card-3d.is-flipped { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
    .fc-face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); border: 3px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px; gap: 6px; transition: border-color .15s; }
    .fc-back { transform: rotateY(180deg); -webkit-transform: rotateY(180deg); }
    .fc-hint { font-size: .78rem; color: var(--muted); font-weight: 600; margin-top: 14px; }
    .fc-ex { font-size: .88rem; color: var(--muted); background: var(--surface-2); border-radius: 14px; padding: 10px 14px; line-height: 1.5; margin-top: 10px; }
    .sw-badge { position: absolute; top: 18px; z-index: 5; font-weight: 800; font-size: 1rem; padding: 6px 14px; border-radius: 12px; opacity: 0; transition: opacity .1s; pointer-events: none; border: 3px solid; background: var(--surface); }
    .sw-badge.ok { right: 18px; color: var(--mint); border-color: var(--mint); transform: rotate(8deg); }
    .sw-badge.no { left: 18px; color: var(--coral); border-color: var(--coral); transform: rotate(-8deg); }
    .swipe-wrap[data-dir="ok"] .sw-badge.ok, .swipe-wrap[data-dir="no"] .sw-badge.no { opacity: 1; }
    .swipe-wrap[data-dir="ok"] .fc-face { border-color: var(--mint); }

    let r;
    try { r = await fetch(cfg.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers: hdr, body: JSON.stringify(args) }); }

  }
  function sanitizeWord(w) {
    const n = x => (Number.isFinite(+x) ? +x : 0);
    const box = (w.box !== undefined && Number.isFinite(+w.box)) ? Math.max(0, Math.min(5, Math.floor(+w.box))) : (w.memorized ? 5 : 0);

  function parseCsv(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = first.includes('\t') ? '\t' : ',';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch;
      } else if (ch === '"' && cur === '') q = true;
      else if (ch === delim) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(c => c.trim() !== '')) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur);
    if (row.some(c => c.trim() !== '')) rows.push(row);
    return rows;
  }
  function importCsv(e) {
    const f = e.target.files[0]; if (!f) return;
    const cat = curCat();
    const r = new FileReader();
    r.onload = ev => {
      try {
        if (!cat) throw new Error('no book');
        const buf = ev.target.result;
        let txt;
        try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
        catch (e1) { try { txt = new TextDecoder('euc-kr').decode(buf); } catch (e2) { txt = new TextDecoder('utf-8').decode(buf); } }
        let rows = parseCsv(txt);
        if (rows.length && /^(word|단어|english|term)$/i.test(str(rows[0][0]))) rows.shift();
        let added = 0, skipped = 0;
        rows.forEach(c => {
          const word = str(c[0]), meaning = str(c[1]);
          if (!word || !meaning) { skipped++; return; }
          if (cat.words.some(w => w.word.toLowerCase() === word.toLowerCase())) { skipped++; return; }
          cat.words.push(sanitizeWord({ id: uid(), word, meaning, phonetic: c[2], koreanPron: c[3], example: c[4], synonyms: c[5] }));
          added++;
        });
        syncStorage(); renderBookDynamic();
        toast(`${added}개 가져왔어요${skipped ? ` (건너뜀 ${skipped}개)` : ''}.`);
      } catch (err) { say('CSV 파일을 읽지 못했어요. 형식을 확인해 주세요.'); }
      e.target.value = '';
    };
    r.readAsArrayBuffer(f);
  }

  const MODES = {
    card:    { name: '플래시카드', ico: IC.cards, desc: '밀어서 외웠음 / 모름' },
    choice:  { name: '뜻 고르기', ico: IC.check, desc: '단어를 보고 뜻 맞히기' },

    spell:   { name: '스펠링', ico: IC.keyboard, desc: '뜻을 보고 직접 쓰기' },
    dict:    { name: '듣고 쓰기', ico: IC.headphones, desc: '발음을 듣고 타이핑' },

  };
  const studyPrefs = { src: 'due', count: SESSION_DEFAULT };
  const parseSrc = s => (s && s.startsWith('cat:')) ? { type: 'cat', id: s.slice(4) } : { type: s || 'all' };
  const srcKey = src => src.type === 'cat' ? 'cat:' + src.id : src.type;

  function poolFor(src) {
    const end = startOfDay() + DAY - 1, all = allWords();
    switch (src.type) {
      case 'cat': return all.filter(x => x.catId === src.id);
      case 'due': return all.filter(x => x.w.box >= 1 && x.w.due <= end);
      case 'new': return all.filter(x => x.w.box === 0);
      case 'wrong': return all.filter(x => x.w.miss > 0);
      case 'star': return all.filter(x => x.w.star);
      default: return all;
    }
  }
  const EMPTY_MSG = { due: '오늘 복습할 단어가 없어요. 잘하고 있어요!', new: '새 단어가 없어요. 단어를 추가해 보세요.', wrong: '오답노트가 비어 있어요.', star: '즐겨찾기한 단어가 없어요. 단어 카드의 별 아이콘을 눌러 보세요.', cat: '이 단어장에 단어가 없어요.', all: '단어가 없어요. 먼저 단어를 추가해 보세요.' };

  function renderStudy() {
    const c = counts();
    const srcs = [
      { k: 'due', n: '오늘 복습', c: c.due }, { k: 'new', n: '새 단어', c: c.newW },
      { k: 'wrong', n: '오답노트', c: c.miss }, { k: 'star', n: '즐겨찾기', c: c.star }, { k: 'all', n: '전체', c: c.total }
    ].concat(categories.map(b => ({ k: 'cat:' + b.id, n: b.name, c: b.words.length })));
    if (!srcs.some(s => s.k === studyPrefs.src)) studyPrefs.src = 'all';
    const counts4 = [[10, '10개'], [20, '20개'], [50, '50개'], [0, '전체']];
    $('tabStudy').innerHTML = `
      <h2 class="page-title">무엇을 공부할까요?</h2>

      <div class="section-title" style="margin-top:14px;"><span>한 번에 학습할 개수</span></div>
      <div class="seg">${counts4.map(([v, n]) => `<button class="${studyPrefs.count === v ? 'on' : ''}" data-act="pick-count" data-v="${v}">${n}</button>`).join('')}</div>

  }
  ACTIONS['pick-src'] = el => { studyPrefs.src = el.dataset.k; renderStudy(); };
  ACTIONS['pick-count'] = el => { studyPrefs.count = parseInt(el.dataset.v, 10); renderStudy(); };
  ACTIONS['study-start'] = el => startSession(el.dataset.mode, parseSrc(studyPrefs.src), studyPrefs.count);

  /* =========================================================
   * 학습 세션 엔진
   * ======================================================= */
  let S = { active: false };

  function startSession(mode, src, count, override) {
    if (!MODES[mode]) return;
    const items = override ? override : poolFor(src);
    if (!items.length) return toast(EMPTY_MSG[src.type] || '학습할 단어가 없어요.');
    if ((mode === 'choice' || mode === 'rchoice') && allWords().length < 4) return toast('4지선다는 전체 단어가 4개 이상 있어야 해요.');
    let q = shuffled(items.map(x => ({ w: x.w, catId: x.catId })));
    if (count > 0) q = q.slice(0, count);
    const dpool = poolFor(src).map(x => x.w);
    S = { active: true, finished: false, mode, src, count, queue: q, total: q.length, idx: 0, ok: 0, no: 0, wrong: new Map(), locked: false, answered: false, options: [], dpool: dpool.length >= 4 ? dpool : allWords().map(x => x.w), startN: (stats.days[dayKey()] || { n: 0 }).n };
    $('studyScreen').classList.add('open');
    document.body.classList.add('no-scroll');
    if (mode === 'listen') startListen(); else renderQuestion();
  }

  function renderQuestion() {
    if (S.idx >= S.queue.length) return finishSession();
    S.locked = false; S.answered = false;
    $('stProg').style.width = (S.idx / S.queue.length * 100) + '%';
    $('stCount').textContent = `${S.idx + 1}/${S.queue.length}`;
    const item = S.queue[S.idx];
    if (S.mode === 'card') renderCard(item);
    else if (S.mode === 'choice') renderChoice(item, false);
    else if (S.mode === 'rchoice') renderChoice(item, true);
    else renderTyping(item, S.mode === 'dict');
    $('stBody').scrollTop = 0;
  }
  const pronText = w => `${w.phonetic} ${w.koreanPron ? `[${w.koreanPron}]` : ''}`.trim();

  function recordResult(item, ok) {
    const w = item.w;
    grade(w, ok);

    if (!ok) {
      if (!S.wrong.has(w.id)) S.wrong.set(w.id, item);
      if (!item.retry) S.queue.push({ w, catId: item.catId, retry: true });

  function nextQuestion() { S.idx++; renderQuestion(); }

  function renderCard(item) {

  function bindSwipe() {
    const wrap = $('swipeWrap'); if (!wrap) return;
    let sx = 0, dx = 0, drag = false, moved = false;
    const reset = () => { wrap.style.transition = 'transform .2s'; wrap.style.transform = ''; wrap.dataset.dir = ''; };
    wrap.addEventListener('pointerdown', e => {
      if (S.locked || e.target.closest('[data-act="speak"]')) return;
      drag = true; moved = false; sx = e.clientX; dx = 0;
      wrap.style.transition = 'none';
      try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    });
    wrap.addEventListener('pointermove', e => {
      if (!drag) return;
      dx = e.clientX - sx;
      if (Math.abs(dx) > 8) moved = true;
      wrap.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
      wrap.dataset.dir = dx > 45 ? 'ok' : dx < -45 ? 'no' : '';
    });
    wrap.addEventListener('pointerup', () => {
      if (!drag) return;
      drag = false;
      if (!moved) { reset(); $('fc3d').classList.toggle('is-flipped'); return; }
      if (dx > 100) flyCard(1); else if (dx < -100) flyCard(-1); else reset();
    });
    wrap.addEventListener('pointercancel', () => { drag = false; reset(); });
  }
  function flyCard(dir) {
    const wrap = $('swipeWrap');
    if (!wrap || S.locked) return;
    S.locked = true;
    wrap.dataset.dir = dir > 0 ? 'ok' : 'no';
    wrap.style.transition = 'transform .28s ease, opacity .28s';
    wrap.style.transform = `translateX(${dir * 520}px) rotate(${dir * 22}deg)`;
    wrap.style.opacity = '0';

    setTimeout(() => {
      if (!S.active || S.idx !== my) return;

    }, 260);

  ACTIONS.fly = el => flyCard(parseInt(el.dataset.dir, 10));

  /* ----- 4지선다 ----- */
  function makeOptions(cur, field) {
    const val = x => x[field];
    const seen = new Set([val(cur)]);
    const d = [];
    const take = list => {
      for (const w of shuffled(list)) {
        if (d.length === 3) break;
        if (w.id !== cur.id && val(w) && !seen.has(val(w))) { seen.add(val(w)); d.push(w); }
      }
    };
    take(S.dpool);
    if (d.length < 3) take(allWords().map(x => x.w));
    return shuffled([cur, ...d]);
  }
  function renderChoice(item, reverse) {

  /* ----- 결과 ----- */
  function finishSession() {

        <div class="row" style="margin-top:6px;">

          <button class="btn btn-primary" data-act="exit-session">마치기</button>
        </div>

  }
  ACTIONS['retry-wrong'] = () => {
    const items = [...S.wrong.values()].map(i => ({ w: i.w, catId: i.catId }));
    startSession(S.mode, S.src, 0, items);

  ACTIONS.again = () => startSession(S.mode, S.src, S.count);

  async function exitSession(force) {

  /* ----- 듣기 모드 ----- */
  let L = { token: 0, items: [], i: 0, playing: false, example: true };
  function startListen() {
    L = { token: L.token + 1, items: S.queue, i: 0, playing: true, example: true };
    renderListen();
    listenLoop(L.token);
  }
  function renderListen() {
    const it = L.items[L.i];
    if (!it) return;
    const w = it.w;
    $('stProg').style.width = (L.i / L.items.length * 100) + '%';
    $('stCount').textContent = `${L.i + 1}/${L.items.length}`;
    $('stBody').innerHTML = `
      <div class="q-wrap">

          <button data-act="l-prev" aria-label="이전">⏮</button>
          <button class="play" data-act="l-toggle" aria-label="재생/일시정지">${L.playing ? '⏸' : '▶'}</button>
          <button data-act="l-next" aria-label="다음">⏭</button>
        </div>
        <label class="switch-row"><input type="checkbox" ${L.example ? 'checked' : ''} onchange="L.example = this.checked"> 예문도 읽어주기</label>
      </div>`;
  }
  async function listenLoop(token) {
    while (L.token === token && L.playing && L.i < L.items.length) {
      const w = L.items[L.i].w;
      renderListen();
      await speak(w.word, 'en-US');
      if (L.token !== token || !L.playing) return;
      await sleep(450);
      await speak(w.meaning.replace(/[()\[\]]/g, ' '), 'ko-KR');
      if (L.token !== token || !L.playing) return;
      if (L.example && w.example) {
        await sleep(350);
        await speak(w.example.split('(')[0], 'en-US');
        if (L.token !== token || !L.playing) return;
      }
      await sleep(900);
      if (L.token !== token || !L.playing) return;
      L.i++;
    }
    if (L.token === token && L.i >= L.items.length) {
      L.playing = false; L.i = L.items.length - 1;
      $('stProg').style.width = '100%';
      toast('한 바퀴 끝! 다시 들으려면 ▶를 누르세요.');
      renderListen();
      L.i = 0;
    }
  }
  function listenRestart() { L.token++; try { window.speechSynthesis.cancel(); } catch (e) {} renderListen(); if (L.playing) listenLoop(L.token); }
  ACTIONS['l-toggle'] = () => {
    L.playing = !L.playing;

    else { L.token++; listenLoop(L.token); }
  };
  ACTIONS['l-next'] = () => { if (L.i < L.items.length - 1) { L.i++; listenRestart(); } };
  ACTIONS['l-prev'] = () => { if (L.i > 0) { L.i--; listenRestart(); } };

  /* =========================================================

  function renderStats() {
    const days = stats.days, goal = config.goal || 20, c = counts();
    let totalN = 0, totalOk = 0;
    Object.keys(days).forEach(k => { totalN += days[k].n; totalOk += days[k].ok; });

    const labels = ['일', '월', '화', '수', '목', '금', '토'];
    const week = [];
    for (let i = 6; i >= 0; i--) { const t = addDays(startOfDay(), -i); week.push({ t, n: (days[dayKey(t)] || { n: 0 }).n, today: i === 0 }); }

    const bars = week.map(x => `<div class="bar-col ${x.today ? 'today' : ''}">${x.n || ''}<i style="height:${Math.max(4, Math.round(x.n / maxN * 100))}%"></i>${labels[new Date(x.t).getDay()]}</div>`).join('');

    const dow = new Date().getDay();
    const gridStart = addDays(startOfDay(), -(28 + dow));
    let heat = labels.map(l => `<div class="heat-h">${l}</div>`).join('');
    for (let i = 0; i < 35; i++) {
      const t = addDays(gridStart, i);

      const n = (days[dayKey(t)] || { n: 0 }).n;
      const lv = n === 0 ? 0 : n < 5 ? 1 : n < 15 ? 2 : n < 30 ? 3 : 4;
      heat += `<div class="cell l${lv} ${t === startOfDay() ? 'is-today' : ''}" title="${dayKey(t)} · ${n}개"></div>`;
    }

    const tot = Math.max(1, c.total);

    $('tabStats').innerHTML = `

      </div>
      <div class="card" style="margin-bottom:12px;">
        <b>단어 레벨</b>
        <div class="stack">
          <i style="width:${c.mastered / tot * 100}%;background:var(--mint)"></i>
          <i style="width:${c.learning / tot * 100}%;background:var(--blue)"></i>
          <i style="width:${c.newW / tot * 100}%;background:var(--line)"></i>
        </div>
        <div class="legend"><span style="--c:var(--mint)">마스터 ${c.mastered}</span><span style="--c:var(--blue)">학습 중 ${c.learning}</span><span style="--c:var(--line)">새 단어 ${c.newW}</span></div>
      </div>
      <div class="card" style="margin-bottom:12px;">
        <b>최근 5주 학습 달력</b>

        <b>자주 틀리는 단어</b>
        ${top.length ? top.map(w => `<div class="miss-item"><b>${esc(w.word)}</b><span>${esc(w.meaning)}</span><span class="badge b-bad" style="flex:none;">${w.wrong}회</span></div>`).join('') : '<div class="empty" style="padding:20px 0 6px;">아직 틀린 단어가 없어요.</div>'}
      </div>`;
  }

  /* =========================================================
   * TTS
   * ======================================================= */
  function voiceFor(lang) {
    try {
      const vs = window.speechSynthesis.getVoices(), L2 = lang.toLowerCase(), n = v => (v.lang || '').toLowerCase().replace('_', '-');
      const exact = vs.filter(v => n(v) === L2);
      if (L2 === 'en-us') return exact.find(v => /samantha|google us|aria|jenny|ava|allison|zira|natural|siri/i.test(v.name)) || exact[0] || null;
      return exact[0] || vs.find(v => n(v).startsWith(L2.slice(0, 2))) || null;
    } catch (e) { return null; }
  }
  function speak(text, lang) {
    return new Promise(res => {
      if (!('speechSynthesis' in window) || !text) return res();
      try { window.speechSynthesis.cancel(); } catch (e) {}
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || 'en-US';
      u.rate = parseFloat(config.ttsRate) || 0.9;
      const v = voiceFor(u.lang); if (v) u.voice = v;
      let done = false;
      const fin = () => { if (!done) { done = true; res(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 6000 + text.length * 160);
      window.speechSynthesis.speak(u);
    });
  }
  function playAudio(text) { speak(text, 'en-US'); }

  /* =========================================================
   * AI 연동 (모델 자동 조회)
   * ======================================================= */
  const PROVIDERS = {
    gemini:    { label: 'Google Gemini',    hint: 'AIza... 로 시작하는 키 (Google AI Studio에서 발급)' },
    xai:       { label: 'xAI Grok',         hint: 'xai-... 로 시작하는 키 (console.x.ai, 크레딧 충전 필요)' },
    openai:    { label: 'OpenAI ChatGPT',   hint: 'sk-... 로 시작하는 키' },
    anthropic: { label: 'Anthropic Claude', hint: 'sk-ant-... 로 시작하는 키' }
  };
  const FALLBACK_MODELS = { gemini: ['gemini-2.5-flash', 'gemini-2.0-flash'], xai: ['grok-3-mini', 'grok-3'], openai: ['gpt-4o-mini'], anthropic: ['claude-haiku-4-5'] };

  class ApiError extends Error { constructor(msg, status) { super(msg); this.status = status || 0; } }

  function cleanKey(raw) {
    const k = String(raw || '').replace(/[\s"'`]/g, '');
    if (k && !/^[\x21-\x7E]+$/.test(k)) throw new ApiError('API 키에 한글이나 특수문자가 섞여 있어요. 키를 다시 복사해서 붙여넣어 주세요.', 0);
    return k;
  }
  async function http(url, options = {}, timeoutMs = 30000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    let resp;
    try { resp = await fetch(url, { ...options, signal: ctrl.signal }); }
    catch (e) {
      clearTimeout(timer);
      if (e.name === 'AbortError') throw new ApiError('응답 시간이 초과되었어요 (30초). 네트워크를 확인하세요.', 0);

    }
    clearTimeout(timer);
    const text = await resp.text();
    let body = null; try { body = JSON.parse(text); } catch (e) {}
    if (!resp.ok) {
      let m = (body && ((body.error && body.error.message) || body.error || body.message)) || text.slice(0, 200) || resp.statusText;

  function authHeaders(p, key) {

    return { 'Authorization': `Bearer ${key}` };
  }
  function friendlyError(p, e) {
    const name = PROVIDERS[p].label, s = e.status, raw = e.message || '';
    if (s === 401 || s === 403 || /API key not valid|invalid.*key|permission/i.test(raw)) {
      const extra = (p === 'xai' && /credit|billing|spending/i.test(raw)) ? '\nxAI는 크레딧(결제)이 있어야 호출돼요. console.x.ai 에서 확인하세요.' : '';
      return `${name} 키 인증에 실패했어요 (${s || '키 오류'}). 키를 다시 확인하세요.${extra}\n원문: ${raw}`;
    }
    if (s === 429) return `${name} 사용 한도를 넘었거나 요청이 너무 잦아요. 잠시 후 다시 시도하거나 결제/한도를 확인하세요.\n원문: ${raw}`;
    if (s === 404) return `${name} 모델을 찾지 못했어요. 설정에서 연결 테스트로 모델 목록을 다시 불러오세요.\n원문: ${raw}`;
    if (s === 400) return `${name} 요청 오류(400).\n원문: ${raw}`;
    if (s >= 500) return `${name} 서버 오류(${s}). 잠시 후 다시 시도하세요.`;
    return raw || `${name} 알 수 없는 오류`;

  const verOf = id => (id.replace(/-\d{8}$/, '').replace(/-\d{4}-\d{2}-\d{2}$/, '').match(/\d+(?:\.\d+)?/g) || []).map(Number);
  function cmpVerDesc(a, b) {
    const A = verOf(a), B = verOf(b);
    for (let i = 0; i < Math.max(A.length, B.length); i++) { const d = (B[i] || 0) - (A[i] || 0); if (d) return d; }
    return 0;
  }
  function rankModels(p, ids) {
    let list = [...new Set(ids)], rank;
    if (p === 'gemini') {
      list = list.filter(id => /^gemini-/.test(id) && !/image|tts|embed|live|audio|robotics|computer|aqa|imagen|veo|native|learnlm/.test(id));
      rank = id => (/flash/.test(id) && !/lite/.test(id) ? 0 : /flash-lite/.test(id) ? 1 : 2) + (/preview|exp/.test(id) ? 0.5 : 0);
    } else if (p === 'xai') {
      list = list.filter(id => /^grok/.test(id) && !/image|imagine|video|vision/.test(id));
      rank = id => (/mini|fast/.test(id) ? 0 : 1);
    } else if (p === 'openai') {
      list = list.filter(id => /^gpt-/.test(id) && !/audio|realtime|image|tts|transcribe|search|instruct|embedding|moderation|codex|chat-latest|preview|-\d{4}-\d{2}-\d{2}$/.test(id));
      rank = id => (/mini|nano/.test(id) ? 0 : 1);
    } else {
      list = list.filter(id => /^claude-/.test(id));
      rank = id => (/haiku/.test(id) ? 0 : /sonnet/.test(id) ? 1 : 2);
    }
    return list.sort((a, b) => rank(a) - rank(b) || cmpVerDesc(a, b));

  async function listModels(p, key) {
    let ids = [];
    if (p === 'gemini') {
      const body = await http('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: authHeaders(p, key) });
      ids = (body.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => String(m.name).replace(/^models\//, ''));
    } else if (p === 'xai') {
      ids = ((await http('https://api.x.ai/v1/models', { headers: authHeaders(p, key) })).data || []).map(m => m.id);
    } else if (p === 'openai') {
      ids = ((await http('https://api.openai.com/v1/models', { headers: authHeaders(p, key) })).data || []).map(m => m.id);
    } else {
      ids = ((await http('https://api.anthropic.com/v1/models?limit=100', { headers: authHeaders(p, key) })).data || []).map(m => m.id);

    return rankModels(p, ids);

  async function requestModel(p, key, model, prompt) {

        method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders(p, key) },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.2, responseMimeType: 'application/json' } })
      });
      const parts = (body.candidates && body.candidates[0] && body.candidates[0].content && body.candidates[0].content.parts) || [];
      const text = parts.filter(x => !x.thought).map(x => x.text || '').join('');
      if (!text) throw new ApiError('빈 응답이 왔어요' + (body.promptFeedback && body.promptFeedback.blockReason ? ` (${body.promptFeedback.blockReason})` : ''), 0);
      return text;
    }

      const url = p === 'xai' ? 'https://api.x.ai/v1/chat/completions' : 'https://api.openai.com/v1/chat/completions';
      const base = { model, messages: [{ role: 'system', content: 'You are a dictionary API. Reply with a single JSON object only.' }, { role: 'user', content: prompt }] };
      const send = payload => http(url, { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders(p, key) }, body: JSON.stringify(payload) });
      let body;
      try { body = await send({ ...base, temperature: 0.2, response_format: { type: 'json_object' } }); }
      catch (e) { if (e.status === 400) body = await send(base); else throw e; }
      const text = (body.choices && body.choices[0] && body.choices[0].message && body.choices[0].message.content) || '';
      if (!text) throw new ApiError('빈 응답이 왔어요', 0);
      return text;
    }
    const body = await http('https://api.anthropic.com/v1/messages', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders(p, key) },
      body: JSON.stringify({ model, max_tokens: 1600, messages: [{ role: 'user', content: prompt }] })
    });

  async function callAi(prompt, normalize) {
    normalize = normalize || normalizeResult;
    const p = config.provider;

    let lastErr = null;
    for (const model of candidates.slice(0, 4)) {

  async function translateText(text, toKo) {

      try {
        const r = await callAi(`Translate the text below from ${from} to ${to}. Natural and accurate; keep the meaning and tone. Reply with JSON only, no markdown: {"t":"<translation>"}\n\nTEXT: ${JSON.stringify(text)}`,
          o => (o && typeof o.t === 'string' && o.t.trim() ? { t: o.t.trim() } : null));

      } catch (e) { /* 기본 번역으로 대체 */ }
    }

    try {
      const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + (toKo ? 'en|ko' : 'ko|en'), { signal: ctl.signal });
      const j = await res.json();

      const d = document.createElement('textarea'); d.innerHTML = t; t = d.value.trim();

    if (!await ask(`'${currentUser}' 계정과 모든 단어, 학습 기록이 삭제돼요.\n되돌릴 수 없어요. 계속할까요?`, { ok: '삭제', danger: true })) return;
    if (cloudMode) {
      try { await Cloud.remove(); } catch (e) { return say(e.code === 'auth/requires-recent-login' ? '보안을 위해 로그인한 직후에만 삭제할 수 있어요. 로그아웃하고 다시 로그인한 뒤 시도해 주세요.' : '삭제하지 못했어요: ' + (e.code || e.message)); }
    } else { const u = getUsers(); delete u[currentUser]; saveUsers(u); }
    try { LS.removeItem(KEY_DATA); LS.removeItem(KEY_CFG); } catch (e) {}
    ACTIONS.logout();
  };
  /* ----- 클라우드 동기화 ----- */
  function cloudMsg(e) {
    const c = (e && e.code) || '';
    return ({ exists: '이미 있는 아이디예요.', invalid: '아이디 또는 비밀번호가 맞지 않아요.', locked: '비밀번호를 여러 번 틀려서 10분간 잠겼어요. 잠시 후 다시 해 주세요.',
      bad_input: '아이디(2~20자)와 비밀번호(6자 이상)를 확인해 주세요.', auth: '로그인이 만료됐어요. 다시 로그인해 주세요.', network: '인터넷 연결을 확인해 주세요.',
      server: '서버 설정에 문제가 있어요. SQL을 실행했는지, config.js 값이 맞는지 확인해 주세요.', offline: '서버에 연결하지 못했어요. 잠시 후 다시 해 주세요.' })[c] || ('오류: ' + (c || (e && e.message) || '알 수 없음'));
  }
  function cloudQueue() { if (!cloudMode || !window.Cloud || !currentUser) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudPush, 1500); }
  async function cloudPush() {
    clearTimeout(cloudTimer); cloudTimer = null;
    if (!cloudMode || !window.Cloud || !currentUser || !Cloud.user()) return;
    const json = JSON.stringify({ categories, stats, cfg: { ttsRate: config.ttsRate, goal: config.goal, darkMode: config.darkMode, provider: config.provider } });
    if (json.length > 900000) toast('데이터가 서버 저장 한도(약 1MB)에 가까워요. 단어장을 줄이거나 백업해 두세요.');
    try { await Cloud.save({ data: json, updated: +LS.getItem(KEY_DATA + ':ts') || Date.now() }); }
    catch (e) { toast('서버 저장에 실패했어요. 인터넷을 확인하세요. (' + (e.code || e.message) + ')'); }
  }
  function applyRemote(r) {
    const d = JSON.parse(r.data);
    categories = sanitizeCategories(d.categories) || defaultCats(); stats = sanitizeStats(d.stats);
    if (d.cfg) {
      config.ttsRate = parseFloat(d.cfg.ttsRate) || config.ttsRate; config.goal = parseInt(d.cfg.goal, 10) || config.goal;
      config.darkMode = !!d.cfg.darkMode; if (PROVIDERS[d.cfg.provider]) config.provider = d.cfg.provider;
    }
    LS.setItem(KEY_DATA, JSON.stringify({ categories, stats })); LS.setItem(KEY_CFG, JSON.stringify(config)); LS.setItem(KEY_DATA + ':ts', String(r.updated));
    applyTheme();
  }
  async function cloudPull() {
    if (!cloudMode || !window.Cloud || !currentUser || cloudTimer || (S && S.active) || $('sheetOv').classList.contains('open') || !Cloud.user()) return;
    try {
      const r = await Cloud.load();
      if (r && r.updated > (+LS.getItem(KEY_DATA + ':ts') || 0)) { applyRemote(r); go(curTab); toast('다른 기기의 변경 내용을 불러왔어요.'); }
    } catch (e) {}
  }
  window.addEventListener('pagehide', () => { if (cloudTimer) cloudPush(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (cloudTimer) cloudPush(); } else cloudPull(); });
  ACTIONS['auth-reset'] = async () => {
    const email = ($('auId').value || '').trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) return say('위 칸에 가입한 이메일을 먼저 입력해 주세요.');
    try { await Cloud.reset(email); say('비밀번호 재설정 메일을 보냈어요.\n메일함(스팸함 포함)을 확인해 주세요.'); } catch (e) { say(cloudMsg(e)); }
  };
  async function bootCloud() {
    $('authScreen').style.display = 'flex';
    $('authScreen').innerHTML = '<div class="auth-box"><p class="muted" style="text-align:center">불러오는 중...</p></div>';
    const ok = await new Promise(r => { if (window.Cloud) return r(true); window.addEventListener('cloudready', () => r(true), { once: true }); setTimeout(() => r(false), 8000); });
    if (!ok) {
      const last = LS.getItem('vocapro_last_uid');
      if (last) { toast('서버에 연결하지 못해 이 기기의 저장본으로 열었어요.'); return enterApp(last, null, LS.getItem('vocapro_last_label')); }
      showAuth(); const m = $('auMsg'); if (m) { m.textContent = '서버에 연결하지 못했어요. 인터넷을 확인하세요.'; m.style.display = 'block'; } return;
    }
    const u = await Cloud.first;
    if (!u) return showAuth();
    let remote = null; try { remote = await Cloud.load(); } catch (e) {}
    enterApp(u.uid, remote, u.email);
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.closest && e.target.closest('#authScreen')) { e.preventDefault(); ACTIONS['auth-go'](); }
  });

  /* =========================================================
   * 시작
   * ======================================================= */
  if ('speechSynthesis' in window) { try { window.speechSynthesis.getVoices(); } catch (e) {} }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
  ACTIONS.install = async () => {
    if (!deferredInstall) return say('브라우저 메뉴에서 "홈 화면에 추가"를 눌러 설치할 수 있어요.\n아이폰은 공유 버튼, 홈 화면에 추가예요.');
    deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null;
  };
  let lastErrAt = 0;
  const softErr = () => { if (Date.now() - lastErrAt > 4000) { lastErrAt = Date.now(); try { toast('일시적인 문제가 생겼어요. 계속 반복되면 새로고침해 주세요.'); } catch (e) {} } };
  window.addEventListener('error', e => { if (e && e.message && !/ResizeObserver/.test(e.message)) softErr(); });
  window.addEventListener('unhandledrejection', e => { e.preventDefault && e.preventDefault(); softErr(); });
  applyTheme();
  let sess = null;
  try { sess = LS.getItem(KEY_SESS) || sessionStorage.getItem(KEY_SESS); } catch (e) {}
  if (cloudMode) bootCloud(); else if (sess && getUsers()[sess]) enterApp(sess); else showAuth();
  </script>
</body>
</html>
