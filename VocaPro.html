<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="VocaPro">
  <meta name="description" content="단어, 끝까지 외우다 — VocaPro 영단어 학습">
  <title>VocaPro - 스마트 단어 마스터</title>
  <style>
    /* =====================================================
     * VocaPro 디자인 v4 · "종이 단어장" 스타일
     * 종이 배경 + 잉크 글자 + 형광펜 강조 + 인덱스 카드
     * ===================================================== */
    :root {
      --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      --serif: var(--font);
      --bg: #f4f3ef; --surface: #ffffff; --surface-2: #efede6; --ink: #1a1d24; --ink-2: #3b404c; --muted: #80838d; --line: #e5e2d9;
      --blue: #2c4fd6; --blue-ink: #1f3cae; --blue-soft: #e9edfc;
      --navy: #17213f; --navy-2: #22305a;
      --mark: #ffe15a; --mark-ink: #3d3300; --mark-soft: #fff5c2;
      --mint: #12996f; --mint-soft: #ddf3ea;
      --coral: #e5484d; --coral-soft: #fdeaea;
      --sun: #f29d12; --sun-soft: #fff0d4;
      --ring: 0 0 0 3px rgba(44, 79, 214, .22);
      --shadow: 0 1px 2px rgba(26, 29, 36, .05), 0 2px 8px rgba(26, 29, 36, .04);
      --shadow-up: 0 -10px 30px rgba(26, 29, 36, .12);
      --pop: 0 14px 40px rgba(23, 33, 63, .22);
      --r: 18px;
    }
    body.dark {
      --bg: #111318; --surface: #1a1d24; --surface-2: #252934; --ink: #eceef2; --ink-2: #c5cad4; --muted: #9097a3; --line: #2c313c;
      --blue: #7d96ff; --blue-ink: #aab9ff; --blue-soft: #232b48;
      --navy: #1d2747; --navy-2: #2a3762;
      --mark: #f5d44a; --mark-ink: #2b2400; --mark-soft: rgba(245, 212, 74, .16);
      --mint: #3ccf9b; --mint-soft: #16372c; --coral: #ff6b70; --coral-soft: #3d2125; --sun: #ffb340; --sun-soft: #3a2e14;
      --ring: 0 0 0 3px rgba(125, 150, 255, .3);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-up: 0 -10px 30px rgba(0, 0, 0, .45);
      --pop: 0 16px 44px rgba(0, 0, 0, .5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--ink); max-width: 480px; margin: 0 auto; min-height: 100vh;
      padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); line-height: 1.45; letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased; transition: background .2s, color .2s;
    }
    @media (min-width: 481px) { body { box-shadow: 0 0 0 1px var(--line); } }
    body.no-scroll { overflow: hidden; }
    button, input, select, textarea { font-family: inherit; color: inherit; font-size: inherit; letter-spacing: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: none; box-shadow: var(--ring); }
    ::selection { background: var(--mark); color: var(--mark-ink); }
    .ic { width: 1.2em; height: 1.2em; flex: none; vertical-align: -.2em; }
    .muted { color: var(--muted); }
    .danger { color: var(--coral) !important; }

    /* ---------- 헤더 ---------- */
    .app-header { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 1.22rem; font-weight: 800; letter-spacing: -0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand b { font-weight: 800; color: var(--blue); }
    .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--navy); color: var(--mark); font-style: normal; font-size: 1rem; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none; letter-spacing: 0; }
    .round-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--ink); }
    .round-btn .ic { width: 19px; height: 19px; }
    .round-btn:active { transform: scale(.94); }

    .view-pane { padding: 4px 16px 20px; display: none; }
    .view-pane.active { display: block; animation: fadeUp .22s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .page-title { font-size: 1.7rem; font-weight: 800; letter-spacing: -.05em; line-height: 1.25; margin: 6px 2px 16px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 28px 2px 10px; font-size: 1.05rem; font-weight: 800; letter-spacing: -.035em; }
    .section-title span { background: linear-gradient(transparent 62%, var(--mark-soft) 62%); padding: 0 2px; }
    .section-title button { background: none; border: none; font-size: .84rem; font-weight: 700; color: var(--muted); }

    /* ---------- 공통 ---------- */
    .btn { border: none; border-radius: 14px; height: 52px; padding: 0 18px; font-size: 1rem; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .12s, background .15s, opacity .15s; }
    .btn:active { transform: scale(.975); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn .ic { width: 17px; height: 17px; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-ink); }
    body.dark .btn-primary { color: #0e1530; }
    body.dark .btn-primary:hover { background: var(--blue-ink); }
    .btn-soft { background: var(--surface-2); color: var(--ink); }
    .btn-ok { background: var(--mint); color: #fff; }
    .btn-bad { background: var(--coral); color: #fff; }
    .btn-block { width: 100%; }
    .btn-sm { height: 38px; padding: 0 13px; font-size: .84rem; border-radius: 11px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; min-width: 0; }
    .link-btn { background: none; border: none; color: var(--blue); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; padding: 0 2px; }
    input[type=text], input[type=password], input[type=number], input[type=search], select, textarea {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 13px; font-size: 1rem; background: var(--surface); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
    }
    select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 19px) 50%, calc(100% - 14px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
    textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
    textarea.short { min-height: 0; resize: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: var(--ring); }
    input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
    .badge { display: inline-flex; align-items: center; font-size: .66rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; letter-spacing: .01em; }
    .b-new { background: var(--surface-2); color: var(--muted); }
    .b-learn { background: var(--blue-soft); color: var(--blue-ink); }
    .b-ok { background: var(--mint-soft); color: var(--mint); }
    .b-bad { background: var(--coral-soft); color: var(--coral); }
    .empty { text-align: center; color: var(--muted); padding: 40px 14px; font-size: .92rem; line-height: 1.7; }
    .empty b { display: block; color: var(--ink); font-size: 1rem; margin-bottom: 2px; }
    .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 7px 14px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
    .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .seg { display: flex; background: var(--surface-2); border-radius: 13px; padding: 4px; gap: 4px; }
    .seg button { flex: 1; border: none; background: transparent; padding: 9px 4px; border-radius: 10px; font-size: .86rem; font-weight: 700; color: var(--muted); transition: background .15s, color .15s; }
    .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .switch-row { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; color: var(--ink-2); cursor: pointer; }
    .switch-row input { width: 18px; height: 18px; accent-color: var(--blue); flex: none; }

    /* ---------- 홈 ---------- */
    .hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 2px 14px; }
    .hello-sub { font-size: .9rem; color: var(--muted); font-weight: 600; }
    .hello-name { font-size: 1.55rem; font-weight: 800; letter-spacing: -.05em; line-height: 1.25; word-break: break-all; }
    .grade-chip { flex: none; border: none; background: var(--mark); color: var(--mark-ink); font-weight: 800; font-size: .85rem; padding: 7px 12px; border-radius: 10px; }
    .hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px 20px 18px; color: #fff; background: var(--navy);
      background-image: repeating-linear-gradient(transparent 0 31px, rgba(255, 255, 255, .055) 31px 32px); }
    .hero::before { content: ''; position: absolute; left: 30px; top: 0; bottom: 0; width: 1.5px; background: rgba(255, 110, 110, .35); }
    .hero > * { position: relative; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-left: 22px; }
    .hero-label { font-size: .88rem; font-weight: 700; opacity: .8; }
    .hero-num { font-size: 3.2rem; font-weight: 900; letter-spacing: -.06em; line-height: 1.05; margin-top: 2px; }
    .hero-num small { font-size: 1.05rem; font-weight: 700; margin-left: 4px; opacity: .8; letter-spacing: 0; }
    .hero-sub { font-size: .86rem; opacity: .78; margin: 8px 0 14px 22px; line-height: 1.5; }
    .hero-mission { display: flex; gap: 6px; margin: 0 0 14px 22px; flex-wrap: wrap; }
    .hero-mission span { background: rgba(255, 255, 255, .1); border-radius: 8px; padding: 4px 9px; font-size: .78rem; font-weight: 600; }
    .hero-mission b { color: var(--mark); font-weight: 800; }
    .hero-btn { background: var(--mark); color: var(--mark-ink); font-weight: 800; font-size: 1.04rem; }
    .hero-btn:hover { filter: brightness(1.03); }
    .ring-box { position: relative; width: 82px; height: 82px; flex-shrink: 0; }
    .ring { width: 82px; height: 82px; }
    .ring-bg { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: 8; }
    .ring-fg { fill: none; stroke: var(--mark); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .6s; }
    .ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .7rem; font-weight: 700; line-height: 1.15; opacity: .9; }
    .ring-txt b { font-size: 1.15rem; font-weight: 900; }

    .streak-card { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px 16px; }
    .streak-fire { width: 40px; height: 40px; border-radius: 12px; background: var(--sun-soft); color: var(--sun); display: flex; align-items: center; justify-content: center; flex: none; }
    .streak-fire .ic { width: 22px; height: 22px; }
    .streak-txt { min-width: 64px; } .streak-txt .muted { font-size: .74rem; font-weight: 600; }
    .streak-n { font-size: 1.05rem; font-weight: 800; letter-spacing: -.03em; }
    .week { display: flex; justify-content: space-between; flex: 1; gap: 2px; }
    .day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .66rem; font-weight: 700; color: var(--muted); }
    .day i { width: 24px; height: 24px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--mark-ink); }
    .day i .ic { width: 14px; height: 14px; }
    .day.done i { background: var(--mark); }
    .day.today { color: var(--ink); }
    .day.today i { box-shadow: 0 0 0 2px var(--ink); }

    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; transition: transform .12s; }
    .tile:active { transform: scale(.98); }
    .tile-ico { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: var(--blue-soft); color: var(--blue); }
    .tile-ico .ic { width: 20px; height: 20px; }
    .tile-ico.t-wrong { background: var(--coral-soft); color: var(--coral); }
    .tile-ico.t-star { background: var(--sun-soft); color: var(--sun); }
    .tile-name { font-weight: 800; font-size: .92rem; letter-spacing: -.03em; }
    .tile-n { font-size: .76rem; color: var(--muted); font-weight: 600; }
    .tool-list { display: flex; flex-direction: column; gap: 8px; }
    .mg-entry { width: 100%; display: flex; align-items: center; gap: 13px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); text-align: left; transition: transform .12s; }
    .mg-entry:active { transform: scale(.985); }
    .mg-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); color: var(--ink); display: flex; align-items: center; justify-content: center; flex: none; }
    .mg-ico .ic { width: 20px; height: 20px; }
    .mg-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .mg-txt b { font-size: .98rem; font-weight: 800; letter-spacing: -.03em; }
    .mg-txt small { color: var(--muted); font-size: .8rem; }
    .mg-chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); margin-right: 4px; flex: none; }

    /* ---------- 단어장 목록 ---------- */
    .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .add-row .btn { flex: none; }
    .book-list { display: flex; flex-direction: column; gap: 8px; }
    .book { display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform .12s; }
    .book:active { transform: scale(.985); }
    .book-spine { width: 62px; flex: none; background: var(--bk, var(--blue)); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .book-spine::after { content: ''; position: absolute; right: 6px; top: 8px; bottom: 8px; border-right: 1.5px dashed rgba(255, 255, 255, .35); }
    .book-spine b { font-size: 1.25rem; font-weight: 900; letter-spacing: -.04em; line-height: 1.1; }
    .book-spine small { font-size: .64rem; font-weight: 700; opacity: .85; }
    .book-body { flex: 1; min-width: 0; padding: 13px 14px 14px; }
    .book-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .book-name { font-size: 1.02rem; font-weight: 800; letter-spacing: -.035em; word-break: break-word; }
    .book-meta { font-size: .76rem; color: var(--muted); font-weight: 600; margin: 2px 0 9px; }
    .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--bk, var(--mint)); border-radius: 99px; transition: width .4s; }

    /* ---------- 단어장 상세 ---------- */
    .book-sum { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; }
    .sum-box { padding: 12px 6px; text-align: center; }
    .sum-box + .sum-box { border-left: 1px solid var(--line); }
    .sum-box b { display: block; font-size: 1.3rem; font-weight: 900; letter-spacing: -.04em; }
    .sum-box span { font-size: .72rem; color: var(--muted); font-weight: 700; }
    .book-actions { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .book-actions .btn { height: 46px; padding: 0 6px; font-size: .88rem; }
    .toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
    .toolbar input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; }
    .icon-btn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--ink); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn .ic { width: 19px; height: 19px; }
    .icon-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .word-list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-bottom: 84px; }
    .word-list:has(.empty) { background: transparent; border: none; }
    .wcard { border-bottom: 1px solid var(--line); padding: 13px 12px 13px 0; }
    .wcard:last-child { border-bottom: none; }
    .wcard.open { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
    .wcard.mastered .w-word, .wcard.mastered .w-mean { opacity: .55; }
    .w-row { display: flex; align-items: flex-start; gap: 4px; }
    .w-no { width: 42px; flex: none; text-align: center; font-size: .72rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 5px; letter-spacing: 0; }
    .w-main { flex: 1; min-width: 0; cursor: pointer; }
    .w-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 7px; }
    .w-word { font-size: 1.2rem; font-weight: 800; letter-spacing: -.02em; word-break: break-word; }
    .w-word.hl { background: linear-gradient(transparent 55%, var(--mark) 55%); padding: 0 2px; margin: 0 -2px; }
    .w-pron { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .w-kpron { font-size: .78rem; color: var(--blue); font-weight: 700; }
    .w-mean { font-size: .96rem; font-weight: 600; color: var(--ink-2); margin-top: 2px; transition: filter .15s; }
    body.hide-content .w-mean:not(.reveal) { filter: blur(6px); user-select: none; }
    .w-badges { display: flex; gap: 4px; margin-top: 6px; }
    .w-side { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
    .w-star, .w-speak { width: 36px; height: 34px; border: none; background: none; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; }
    .w-star .ic, .w-speak .ic { width: 19px; height: 19px; }
    .w-star.on { color: var(--sun); } .w-star.on .ic { fill: currentColor; }
    .w-speak { color: var(--blue); }
    .w-detail { margin: 12px 0 2px 46px; display: flex; flex-direction: column; gap: 12px; font-size: .9rem; }
    .w-detail h4 { font-size: .72rem; color: var(--muted); font-weight: 800; letter-spacing: .04em; margin-bottom: 4px; }
    .w-ex { border-left: 3px solid var(--mark); padding: 2px 0 2px 12px; }
    .ex-en { font-weight: 600; line-height: 1.55; color: var(--ink); }
    .ex-ko { display: block; color: var(--muted); line-height: 1.55; margin-top: 2px; }
    .w-ex .btn-sm { margin-top: 8px; }
    .ex-say { border: none; background: none; color: var(--blue); vertical-align: middle; padding: 0 2px; }
    .ex-say .ic { width: 16px; height: 16px; }
    .w-due { font-size: .78rem; }
    .syn-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .syn { background: var(--blue-soft); color: var(--blue-ink); border: none; border-radius: 9px; padding: 5px 10px; font-size: .82rem; font-weight: 700; }
    .w-tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .note-box { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; line-height: 1.55; }
    .note-box ul { padding-left: 18px; }
    .fab { position: fixed; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); right: max(16px, calc(50% - 224px)); width: 56px; height: 56px; border-radius: 18px; border: none; background: var(--navy); color: var(--mark); box-shadow: 0 10px 24px rgba(23, 33, 63, .35); z-index: 30; display: flex; align-items: center; justify-content: center; }
    .fab .ic { width: 26px; height: 26px; }
    .fab:active { transform: scale(.94); }

    /* ---------- 학습 탭 ---------- */

    /* ---------- 학습 화면 ---------- */
    .study-screen { position: fixed; inset: 0; max-width: 480px; margin: 0 auto; background: var(--bg); z-index: 150; display: none; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
    .study-screen.open { display: flex; }
    .study-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .study-top .x { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .x .ic, .sheet-head button .ic, .tr-x .ic { width: 18px; height: 18px; }
    .prog { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .prog i { display: block; height: 100%; width: 0; background: var(--blue); border-radius: 99px; transition: width .3s; }
    .st-count { font-size: .82rem; font-weight: 800; color: var(--muted); min-width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
    #stBody { flex: 1; overflow-y: auto; padding: 4px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
    .q-wrap { display: flex; flex-direction: column; gap: 12px; min-height: 100%; }
    .q-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 30px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }

    .q-pron { display: inline-block; align-self: center; color: var(--blue-ink); background: var(--blue-soft); padding: 3px 12px; border-radius: 8px; font-size: .88rem; font-weight: 600; }
    .q-pron:empty { display: none; }

    .q-sub { font-size: .88rem; color: var(--ink-2); margin-top: 8px; line-height: 1.55; }

    .q-hint { font-size: 1.4rem; letter-spacing: .14em; color: var(--muted); margin-top: 6px; font-weight: 700; }
    .q-speak { margin-top: 8px; width: 46px; height: 46px; border-radius: 14px; border: none; background: var(--blue-soft); color: var(--blue); display: inline-flex; align-items: center; justify-content: center; }
    .q-speak .ic { width: 22px; height: 22px; }
    .q-speak.big { width: 92px; height: 92px; border-radius: 28px; } .q-speak.big .ic { width: 42px; height: 42px; }
    .opts { display: flex; flex-direction: column; gap: 8px; }
    .opt { display: flex; align-items: center; gap: 12px; text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 15px; padding: 15px 16px; font-size: 1rem; font-weight: 700; color: var(--ink); transition: transform .1s, background .15s, border-color .15s; }
    .opt:active { transform: scale(.985); }
    .opt-n { width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: .78rem; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .opt:disabled { cursor: default; }
    .opt.correct { background: var(--mint-soft); border-color: var(--mint); }
    .opt.correct .opt-n { background: var(--mint); color: #fff; }
    .opt.wrong { background: var(--coral-soft); border-color: var(--coral); }
    .opt.wrong .opt-n { background: var(--coral); color: #fff; }
    .type-input { text-align: center; font-size: 1.5rem !important; font-weight: 700; padding: 16px !important; border-radius: 16px !important; }
    .fb { border-radius: 14px; padding: 14px 16px; font-weight: 700; line-height: 1.5; }
    .fb.ok { background: var(--mint-soft); color: var(--mint); }
    .fb.bad { background: var(--coral-soft); color: var(--coral); }

    .q-foot { margin-top: auto; }

    /* 플래시카드: 인덱스 카드 */
    .sw-hint { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 700; padding: 0 6px; }
    .sw-hint .no { color: var(--coral); } .sw-hint .ok { color: var(--mint); }
    .swipe-area { flex: 1; display: flex; align-items: center; min-height: 330px; }
    .swipe-wrap { position: relative; width: 100%; height: 360px; perspective: 1100px; touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; }
    .fc-card-3d { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.4, .2, .2, 1); transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
    .fc-card-3d.is-flipped { transform: rotateY(180deg); }
    .fc-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 34px 24px 24px; gap: 6px; transition: border-color .15s;
      background: var(--surface); background-image: linear-gradient(var(--coral) 0 0), repeating-linear-gradient(transparent 0 33px, color-mix(in srgb, var(--blue) 12%, transparent) 33px 34px);
      background-size: 100% 2px, 100% 100%; background-position: 0 46px, 0 46px; background-repeat: no-repeat, repeat; box-shadow: 0 18px 40px rgba(23, 33, 63, .1); }
    .fc-back { transform: rotateY(180deg); }
    .fc-hint { font-size: .78rem; color: var(--muted); font-weight: 600; margin-top: 14px; }
    .fc-ex { font-size: .9rem; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; line-height: 1.5; margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
    .fc-ex small { color: var(--muted); font-size: .84rem; }
    .sw-badge { position: absolute; top: 60px; z-index: 5; font-weight: 900; font-size: 1rem; padding: 5px 13px; border-radius: 10px; opacity: 0; transition: opacity .1s; pointer-events: none; border: 3px solid; background: var(--surface); }
    .sw-badge.ok { right: 18px; color: var(--mint); transform: rotate(8deg); }
    .sw-badge.no { left: 18px; color: var(--coral); transform: rotate(-8deg); }
    .swipe-wrap[data-dir="ok"] .sw-badge.ok, .swipe-wrap[data-dir="no"] .sw-badge.no { opacity: 1; }
    .swipe-wrap[data-dir="ok"] .fc-face { border-color: var(--mint); }
    .swipe-wrap[data-dir="no"] .fc-face { border-color: var(--coral); }

    .result { text-align: center; padding-top: 6px; }
    .result div.emoji { width: 92px; height: 92px; margin: 10px auto 16px; border-radius: 28px; background: var(--mark); color: var(--mark-ink); display: flex; align-items: center; justify-content: center; animation: pop .5s cubic-bezier(.2, .9, .3, 1.2); }
    .result div.emoji .ic { width: 44px; height: 44px; }
    .result h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -.045em; }
    .result .score { font-size: 3rem; font-weight: 900; letter-spacing: -.05em; color: var(--blue); margin: 2px 0; }
    .result-box { text-align: left; margin: 14px 0; }
    .wrong-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
    .wrong-item:last-child { border-bottom: none; }
    .wrong-item b { font-size: 1.02rem; font-weight: 800; }
    .wrong-item span { flex: 1; color: var(--muted); }
    .player { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 8px 0; }
    .player button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 54px; height: 54px; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
    .player button .ic { width: 22px; height: 22px; }
    .player .play { width: 76px; height: 76px; border-radius: 24px; background: var(--navy); border-color: var(--navy); color: var(--mark); }
    .player .play .ic { width: 30px; height: 30px; }

    /* ---------- 통계 ---------- */
    .stat-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 6px; text-align: center; }
    .stat-tile b { display: block; font-size: 1.4rem; font-weight: 900; letter-spacing: -.045em; }
    .stat-tile span { font-size: .72rem; color: var(--muted); font-weight: 700; }
    .bars { display: flex; justify-content: space-between; align-items: flex-end; height: 130px; gap: 8px; margin-top: 10px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: .7rem; font-weight: 700; color: var(--muted); }
    .bar-col i { display: block; width: 100%; max-width: 26px; border-radius: 7px 7px 3px 3px; background: var(--blue-soft); min-height: 4px; }
    .bar-col.today i { background: var(--blue); }
    .bar-col.today { color: var(--ink); }
    .goal-line { font-size: .8rem; color: var(--muted); margin-top: 8px; }
    .stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 10px 0 8px; }
    .stack i { display: block; height: 100%; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; font-weight: 600; color: var(--muted); }
    .legend span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }
    .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
    .heat-h { text-align: center; font-size: .68rem; font-weight: 700; color: var(--muted); }
    .cell { aspect-ratio: 1; border-radius: 6px; background: var(--surface-2); }
    .cell.l1 { background: #d6defb; } .cell.l2 { background: #a3b4f3; } .cell.l3 { background: #5f7ce4; } .cell.l4 { background: var(--blue-ink); }
    body.dark .cell.l1 { background: #26305a; } body.dark .cell.l2 { background: #3a4a8f; } body.dark .cell.l3 { background: #5d73d6; } body.dark .cell.l4 { background: #aab9ff; }
    .cell.future { background: transparent; }
    .cell.is-today { box-shadow: 0 0 0 2px var(--ink); }
    .miss-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
    .miss-item:last-child { border-bottom: none; }
    .miss-item b { font-size: 1.02rem; }
    .miss-item span { flex: 1; color: var(--muted); }

    /* ---------- 설정 ---------- */
    .settings-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 12px; }
    .settings-title { font-size: .98rem; font-weight: 800; letter-spacing: -.03em; margin-bottom: 14px; }

    .setting-label { font-size: .8rem; font-weight: 700; color: var(--muted); }
    .cfg-status { font-size: .82rem; font-weight: 600; line-height: 1.55; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); display: none; white-space: pre-wrap; word-break: break-word; }
    .cfg-status.ok { display: block; background: var(--mint-soft); color: var(--mint); }
    .cfg-status.err { display: block; background: var(--coral-soft); color: var(--coral); }

    .rm-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .rm-row input[type=time] { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-weight: 700; color: var(--ink); }
    .foot-credit { text-align: center; color: var(--muted); font-size: .75rem; margin: 22px 0 40px; letter-spacing: .02em; }
    .legal-links { text-align: center; color: var(--muted); font-size: .8rem; margin: 22px 0 6px; }
    .lg-a { color: var(--blue); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }

    /* ---------- 시트 / 대화상자 ---------- */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(12, 15, 26, .5); z-index: 200; display: none; align-items: flex-end; }
    .sheet-overlay.open { display: flex; animation: fade .18s; }
    .sheet { width: 100%; max-width: 480px; margin: 0 auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-up); animation: sheetUp .24s cubic-bezier(.2, .9, .3, 1); }
    @keyframes sheetUp { from { transform: translateY(50px); opacity: .4; } to { transform: none; opacity: 1; } }
    .sheet-grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 12px; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sheet-head b { font-size: 1.15rem; font-weight: 800; letter-spacing: -.035em; }
    .sheet-head button { border: none; background: var(--surface-2); color: var(--ink); width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
    .form-stack { display: flex; flex-direction: column; gap: 6px; }
    .f-lab { font-size: .76rem; font-weight: 800; color: var(--muted); margin: 6px 2px 0; display: block; }

    .f-ai > .btn { flex: none; height: auto; min-height: 50px; }

    .ai-state.ok { background: var(--mint-soft); color: var(--mint); }
    .ai-state.err { background: var(--coral-soft); color: var(--coral); }
    .ai-state .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 7px; animation: blink 1s infinite; vertical-align: 1px; }
    @keyframes blink { 50% { opacity: .25; } }
    .menu-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }

    .menu-list button + button { border-top: 1px solid var(--line); }
    .bulk-status { font-size: .85rem; font-weight: 600; color: var(--muted); white-space: pre-wrap; line-height: 1.6; }
    .dlg-ov { position: fixed; inset: 0; background: rgba(12, 15, 26, .55); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .16s; }
    .dlg { background: var(--surface); color: var(--ink); border-radius: 20px; padding: 22px 20px 18px; width: 100%; max-width: 340px; box-shadow: var(--pop); animation: pop .22s cubic-bezier(.2, .9, .3, 1.2); }

    .dlg input { width: 100%; margin-bottom: 14px; }

    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }

    /* ---------- 로그인 ---------- */
    .auth { position: fixed; inset: 0; z-index: 600; background: var(--bg); background-image: repeating-linear-gradient(transparent 0 35px, color-mix(in srgb, var(--blue) 7%, transparent) 35px 36px); align-items: center; justify-content: center; padding: 24px 18px; overflow: auto; }

    /* ---------- 하단 탭 ---------- */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 60; }
    .nav-item { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; font-size: .68rem; font-weight: 700; color: var(--muted); padding: 7px 0 5px; border-radius: 12px; transition: color .15s; }
    .nav-item svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: var(--ink); }
    .nav-item.active svg { stroke-width: 2.3; }

    .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); background: #262a33; color: #fff; padding: 11px 18px; border-radius: 12px; font-size: .86rem; font-weight: 700; opacity: 0; pointer-events: none; transition: .25s; z-index: 800; max-width: 90%; text-align: center; white-space: pre-line; }

    @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }

    /* ---------- 학년별 추천 (하단 알림) ---------- */
    .rec { position: fixed; left: 0; right: 0; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); width: calc(100% - 20px); max-width: 460px; margin: 0 auto; z-index: 100; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 14px 10px; box-shadow: var(--pop); transform: translateY(24px); opacity: 0; transition: transform .28s cubic-bezier(.2, .9, .3, 1), opacity .2s; }
    .rec.show { transform: none; opacity: 1; }
    .rec-head { display: flex; align-items: center; gap: 10px; }
    .rec-ico { width: 36px; height: 36px; border-radius: 11px; background: var(--mark); color: var(--mark-ink); display: flex; align-items: center; justify-content: center; flex: none; }
    .rec-ico .ic { width: 19px; height: 19px; }
    .rec-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .rec-title b { font-size: .96rem; font-weight: 800; letter-spacing: -.03em; }
    .rec-title small { font-size: .76rem; color: var(--muted); font-weight: 600; }
    .rec-x { width: 32px; height: 32px; border: none; background: var(--surface-2); border-radius: 10px; color: var(--muted); display: flex; align-items: center; justify-content: center; flex: none; }
    .rec-x .ic { width: 16px; height: 16px; }

  function counts() {
    const end = endOfToday();
    const c = { total: 0, newW: 0, learning: 0, mastered: 0, due: 0, miss: 0, star: 0 };
    allWords().forEach(({ w }) => {
      c.total++;
      if (w.box === 0) c.newW++; else if (w.box >= 5) c.mastered++; else c.learning++;
      if (w.box >= 1 && w.due <= end) c.due++;
      if (w.miss > 0) c.miss++;
      if (w.star) c.star++;
    });
    return c;
  }

  function grade(w, ok) {
    const today = startOfDay();
    const key = dayKey();
    if (ok) {
      if (w.last !== key) { w.box = Math.min(5, w.box + 1); w.due = addDays(today, INTERVALS[w.box]); }
      w.reps++;
      if (w.miss > 0) w.miss--;
    } else {
      w.box = 1; w.due = addDays(today, 1); w.wrong++; w.miss = 2;
    }
    w.last = key;
  }
  function dueText(w) {
    if (w.box === 0) return '아직 학습 전';
    const diff = Math.round((startOfDay(w.due) - startOfDay()) / DAY);
    if (diff <= 0) return '오늘 복습';
    if (diff === 1) return '내일 복습';
    return diff + '일 뒤 복습';
  }
  function streak() {
    let t = startOfDay();
    const has = x => (stats.days[dayKey(x)] || {}).n > 0;
    if (!has(t)) t = addDays(t, -1);
    let n = 0;
    while (has(t)) { n++; t = addDays(t, -1); }
    return n;
  }
  function bestStreak() {
    const keys = Object.keys(stats.days).filter(k => stats.days[k].n > 0).sort();
    let best = 0, cur = 0, prev = null;
    keys.forEach(k => {
      const t = new Date(k + 'T00:00:00').getTime();
      cur = (prev !== null && Math.round((t - prev) / DAY) === 1) ? cur + 1 : 1;
      best = Math.max(best, cur); prev = t;
    });
    return best;
  }
  function recordStat(ok) {
    const k = dayKey();
    if (!stats.days[k]) stats.days[k] = { n: 0, ok: 0 };
    stats.days[k].n++;
    if (ok) stats.days[k].ok++;
  }

  const BOOK_COLORS = ['#2f54eb', '#13a07a', '#f08c1a', '#7a52e0', '#e0457b', '#1196c9'];
  const bookColor = id => { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return BOOK_COLORS[h % BOOK_COLORS.length]; };

  /* =========================================================
   * 테마 / 라우팅
   * ======================================================= */
  ACTIONS.theme = () => { config.darkMode = !config.darkMode; applyTheme(); syncStorage(); };
  function applyTheme() {
    document.body.classList.toggle('dark', !!config.darkMode);
    $('btnTheme').innerHTML = config.darkMode ? IC.sun : IC.moon;
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', config.darkMode ? '#16181d' : '#ffffff');
  }

  let curTab = 'tabHome';
  const TITLES = { tabBooks: '단어장', tabStudy: '학습', tabStats: '통계', tabSettings: '설정' };
  function go(id) {
    curTab = id;
    if (id !== 'tabHome') { const rv = $('recOv'); if (rv) rv.remove(); }
    document.querySelectorAll('.view-pane').forEach(el => el.classList.remove('active'));
    $(id).classList.add('active');
    const navFor = id === 'paneBook' ? 'tabBooks' : id;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.t === navFor));
    $('btnBackHome').style.display = id === 'paneBook' ? 'flex' : 'none';
    if (id === 'tabHome') $('headTitle').innerHTML = '<i class="brand-mark">V</i><span><b>Voca</b>Pro</span>';
    else if (id === 'paneBook') $('headTitle').textContent = (curCat() || {}).name || '단어장';
    else $('headTitle').textContent = TITLES[id] || 'VocaPro';

    if (id === 'tabHome') renderHome();
    else if (id === 'tabBooks') renderBooks();
    else if (id === 'paneBook') renderBookDynamic();
    else if (id === 'tabStudy') renderStudy();
    else if (id === 'tabStats') renderStats();
    else if (id === 'tabSettings') loadSettingsUI();
    window.scrollTo(0, 0);
  }
  ACTIONS.tab = el => go(el.dataset.t);
  ACTIONS.back = () => go('tabBooks');

  /* =========================================================
   * 홈
   * ======================================================= */
  function ringSvg(pct) {
    const r = 34, c = 2 * Math.PI * r;
    return `<svg class="ring" viewBox="0 0 84 84"><circle class="ring-bg" cx="42" cy="42" r="${r}"/><circle class="ring-fg" cx="42" cy="42" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct)).toFixed(1)}" transform="rotate(-90 42 42)"/></svg>`;
  }

  function renderHome() {
    const c = counts();
    const goal = config.goal || 20;
    const today = stats.days[dayKey()] || { n: 0, ok: 0 };
    const pct = Math.min(1, today.n / goal);
    const st = streak();

    let cta;
    if (c.total === 0) cta = { big: '0', unit: '개', label: '오늘의 복습', sub: '단어를 추가하면 복습 일정이 자동으로 만들어져요.', btn: '단어 추가하기', attrs: 'data-act="tab" data-t="tabBooks"' };
    else if (c.due > 0) cta = { big: c.due, unit: '개', label: '오늘의 복습', sub: '잊어버리기 직전에 복습하면 오래 기억돼요.', btn: '복습 시작', attrs: 'data-act="start" data-mode="card" data-src="due"' };
    else if (c.newW > 0) cta = { big: c.newW, unit: '개', label: '새 단어', sub: '오늘 복습은 끝났어요. 새 단어를 배워볼까요?', btn: '새 단어 학습', attrs: 'data-act="start" data-mode="card" data-src="new"' };
    else cta = { big: c.total, unit: '개', label: '전체 단어', sub: '모든 단어를 학습했어요. 새 단어를 더 추가해 보세요.', btn: '단어 추가하기', attrs: 'data-act="tab" data-t="tabBooks"' };

    const labels = ['일', '월', '화', '수', '목', '금', '토'];
    let week = '';
    for (let i = 6; i >= 0; i--) {
      const t = addDays(startOfDay(), -i);
      const d = stats.days[dayKey(t)];
      week += `<div class="day ${d && d.n > 0 ? 'done' : ''} ${i === 0 ? 'today' : ''}"><i>${d && d.n > 0 ? IC.tick : ''}</i>${labels[new Date(t).getDay()]}</div>`;
    }

    const hour = new Date().getHours();
    const hello = hour < 6 ? '늦은 밤이에요' : hour < 12 ? '좋은 아침이에요' : hour < 18 ? '오늘도 한 걸음 더' : '하루 마무리 복습 어때요?';
    const gname = GRADE_NAMES[config.grade];
    const books = categories.slice(0, 3).map(bookCardHtml).join('');

    $('tabHome').innerHTML = `
      <div class="hello"><div><div class="hello-sub">${hello}</div><div class="hello-name">${esc(currentLabel || currentUser || '')}님</div></div>
        <button class="grade-chip" data-act="grade-pick">${gname ? esc(gname) : '학년 설정'}</button></div>
      <section class="hero">
        <div class="hero-top">
          <div>
            <div class="hero-label">${cta.label}</div>
            <div class="hero-num">${cta.big}<small>${cta.unit}</small></div>
          </div>
          <div class="ring-box">${ringSvg(pct)}<div class="ring-txt"><b>${Math.min(today.n, 999)}</b>/${goal}</div></div>
        </div>
        <div class="hero-sub">${cta.sub}</div>
        <div class="hero-mission"><span>복습 <b>${c.due}</b></span><span>새 단어 <b>${c.newW}</b></span><span>마스터 <b>${c.mastered}</b></span></div>
        <button class="btn hero-btn btn-block" ${cta.attrs}>${cta.btn}</button>
      </section>

      <div class="card streak-card">
        <div class="streak-fire">${st > 0 ? IC.flame : IC.sprout}</div>
        <div class="streak-txt"><div class="streak-n">${st}일 연속</div><div class="muted">${st > 0 ? '학습 중이에요' : '오늘 시작해요'}</div></div>
        <div class="week">${week}</div>
      </div>

      <div class="section-title"><span>바로 학습</span></div>
      <div class="tiles">
        <button class="tile" data-act="start" data-mode="card" data-src="new"><div class="tile-ico">${IC.sprout}</div><div><div class="tile-name">새 단어</div><div class="tile-n">${c.newW}개</div></div></button>
        <button class="tile" data-act="start" data-mode="choice" data-src="wrong"><div class="tile-ico t-wrong">${IC.bookx}</div><div><div class="tile-name">오답노트</div><div class="tile-n">${c.miss}개</div></div></button>
        <button class="tile" data-act="start" data-mode="card" data-src="star"><div class="tile-ico t-star">${IC.star}</div><div><div class="tile-name">즐겨찾기</div><div class="tile-n">${c.star}개</div></div></button>
        <button class="tile" data-act="start" data-mode="listen" data-src="due"><div class="tile-ico">${IC.headphones}</div><div><div class="tile-name">듣기 모드</div><div class="tile-n">복습 단어 듣기</div></div></button>
      </div>

      <div class="section-title"><span>학습 도구</span></div>
      <div class="tool-list">${flowEntryHtml()}<button class="mg-entry" data-act="match"><span class="mg-ico">${IC.cards}</span><span class="mg-txt"><b>짝 맞추기</b><small>영어와 뜻을 빠르게 연결해요</small></span><span class="mg-chev"></span></button>${recEntryHtml()}${packEntryHtml()}${ltEntryHtml()}</div>

      <div class="section-title"><span>내 단어장</span><button data-act="tab" data-t="tabBooks">전체 보기</button></div>
      <div class="book-list">${books || '<div class="empty"><b>아직 단어장이 없어요</b>단어장 탭에서 새로 만들어 보세요.</div>'}</div>
    `;
    recMaybeShow();
  }

  ACTIONS.start = el => startSession(el.dataset.mode, parseSrc(el.dataset.src), el.dataset.count !== undefined ? parseInt(el.dataset.count, 10) : SESSION_DEFAULT);

  /* =========================================================
   * 단어장 목록 / 단어장 상세
   * ======================================================= */
  function bookCardHtml(b) {
    const total = b.words.length;
    const mastered = b.words.filter(w => w.box >= 5).length;
    const end = endOfToday();
    const due = b.words.filter(w => w.box >= 1 && w.due <= end).length;
    const pct = total ? Math.round(mastered / total * 100) : 0;
    return `
      <div class="book" style="--bk:${bookColor(b.id)}" data-act="open-book" data-id="${esc(b.id)}">
        <div class="book-spine"><b>${total}</b><small>단어</small></div>
        <div class="book-body">
          <div class="book-top"><span class="book-name">${esc(b.name)}</span>${due ? `<span class="badge b-learn">복습 ${due}</span>` : ''}</div>
          <div class="book-meta">마스터 ${mastered}개 · ${pct}%</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>
      </div>`;
  }
  function renderBooks() {
    $('folderContainer').innerHTML = categories.map(bookCardHtml).join('') ||
      '<div class="empty"><b>단어장이 없어요</b>위에서 이름을 입력하고 만들기를 눌러 보세요.</div>';
  }
  ACTIONS['add-book'] = () => {
    const input = $('inCatName');
    const val = input.value.trim();
    if (!val) return toast('단어장 이름을 입력하세요.');
    categories.push({ id: 'c' + uid(), name: val, words: [] });
    input.value = '';
    syncStorage(); renderBooks(); toast('단어장을 만들었어요.');
  };
  ACTIONS['open-book'] = el => openBook(el.dataset.id);

  let bookFilter = 'all', currentFilter = '', viewOrder = null;
  const openDrawers = new Set();

  function openBook(id) {
    if (!findBook(id)) return;
    currentCategoryId = id; bookFilter = 'all'; currentFilter = ''; viewOrder = null; openDrawers.clear();
    buildBookPane();
    go('paneBook');
  }
  function buildBookPane() {
    $('paneBook').innerHTML = `
      <div class="book-sum" id="bookSummary"></div>
      <div class="book-actions">
        <button class="btn btn-primary" data-act="start" data-mode="card" data-src="cat:${esc(currentCategoryId)}">카드 학습</button>
        <button class="btn btn-soft" data-act="start" data-mode="choice" data-src="cat:${esc(currentCategoryId)}">퀴즈</button>
        <button class="btn btn-soft" data-act="book-menu">더보기</button>
      </div>
      <div class="toolbar">
        <input type="text" id="searchFilter" placeholder="단어나 뜻 검색" oninput="onSearch(this.value)">
        <button class="icon-btn" data-act="shuffle" aria-label="섞기">${IC.shuffle}</button>
        <button class="icon-btn ${document.body.classList.contains('hide-content') ? 'on' : ''}" id="btnBlurToggle" data-act="blur" aria-label="뜻 가리기">${IC.eyeoff}</button>
      </div>
      <div class="chips" id="bookChips"></div>
      <div class="word-list" id="wordCardStream"></div>
      <button class="fab" data-act="add-sheet" aria-label="단어 추가">${IC.plus}</button>`;
  }
  function onSearch(v) { currentFilter = v.trim(); renderWordList(); }

  const FILTERS = [['all', '전체'], ['new', '새 단어'], ['learning', '학습 중'], ['mastered', '마스터'], ['star', '즐겨찾기'], ['miss', '오답']];
  function renderBookDynamic() {
    const cat = curCat();
    if (!cat) return go('tabBooks');
    const end = endOfToday();
    const total = cat.words.length, mastered = cat.words.filter(w => w.box >= 5).length;
    const due = cat.words.filter(w => w.box >= 1 && w.due <= end).length;
    $('bookSummary').innerHTML = `<div class="sum-box"><b>${total}</b><span>전체</span></div><div class="sum-box"><b>${mastered}</b><span>마스터</span></div><div class="sum-box"><b>${due}</b><span>오늘 복습</span></div>`;
    $('bookChips').innerHTML = FILTERS.map(([k, n]) => `<button class="chip ${bookFilter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${n}</button>`).join('');
    renderWordList();
  }
  ACTIONS.filter = el => { bookFilter = el.dataset.f; renderBookDynamic(); };
  ACTIONS.shuffle = () => {
    const cat = curCat();
    if (!cat || cat.words.length <= 1) return;
    viewOrder = shuffled(cat.words.map(w => w.id));
    renderWordList(); toast('순서를 섞었어요.');
  };
  ACTIONS.blur = () => {
    document.body.classList.toggle('hide-content');
    const b = $('btnBlurToggle');
    if (b) b.classList.toggle('on', document.body.classList.contains('hide-content'));
    renderWordList();
  };

  function visibleWords() {
    const cat = curCat();
    if (!cat) return [];
    let list = [...cat.words];
    if (viewOrder) {
      const pos = new Map(viewOrder.map((id, i) => [id, i]));
      list.sort((a, b) => (pos.has(a.id) ? pos.get(a.id) : -1) - (pos.has(b.id) ? pos.get(b.id) : -1));
    }
    list = list.filter(w => {
      if (bookFilter === 'new') return w.box === 0;
      if (bookFilter === 'learning') return w.box >= 1 && w.box < 5;
      if (bookFilter === 'mastered') return w.box >= 5;
      if (bookFilter === 'star') return w.star;
      if (bookFilter === 'miss') return w.miss > 0;
      return true;
    });
    if (currentFilter) {
      const q = currentFilter.toLowerCase();
      list = list.filter(w => w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q));
    }
    return list;
  }
  function lvlBadge(w) {
    if (w.box === 0) return '<span class="badge b-new">NEW</span>';
    if (w.box >= 5) return '<span class="badge b-ok">마스터</span>';
    return `<span class="badge b-learn">Lv.${w.box}</span>`;
  }
  function noteHtml(n) {
    if (!n) return '';
    let h = '<div class="note-box">';
    if (n.etymology) h += `<div><h4>어원 · 구조</h4>${esc(n.etymology)}</div>`;
    if (n.tip) h += `<div><h4>암기 팁</h4>${esc(n.tip)}</div>`;
    if (n.examples.length) h += `<div><h4>예문</h4><ul>${n.examples.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    if (n.confusable.length) h += `<div><h4>헷갈리는 단어</h4><ul>${n.confusable.map(c => `<li><b>${esc(c.word)}</b> ${esc(c.meaning)} · ${esc(c.diff)}</li>`).join('')}</ul></div>`;
    return h + '</div>';
  }

  function renderWordList() {
    const box = $('wordCardStream');
    if (!box) return;
    const list = visibleWords();
    if (!list.length) {
      const cat = curCat();
      box.innerHTML = (cat && cat.words.length === 0)
        ? '<div class="empty"><b>첫 단어를 추가해 볼까요?</b>오른쪽 아래 + 버튼을 눌러 단어를 넣으면 AI가 뜻과 예문을 채워줘요.</div>'
        : '<div class="empty"><b>조건에 맞는 단어가 없어요</b>필터나 검색어를 바꿔 보세요.</div>';
      return;
    }
    box.innerHTML = list.map((w, i) => {
      const syns = w.synonyms.split(',').map(s => s.trim()).filter(Boolean);
      const open = openDrawers.has(w.id);
      return `
      <div class="wcard ${w.box >= 5 ? 'mastered' : ''} ${open ? 'open' : ''}" data-wid="${esc(w.id)}">
        <div class="w-row">
          <span class="w-no">${String(i + 1).padStart(3, '0')}</span>
          <div class="w-main" data-act="expand">
            <div class="w-head"><span class="w-word ${w.star ? 'hl' : ''}">${esc(w.word)}</span>${w.phonetic ? `<span class="w-pron">${esc(w.phonetic)}</span>` : ''}${w.koreanPron ? `<span class="w-kpron">[${esc(w.koreanPron)}]</span>` : ''}</div>
            <div class="w-mean">${esc(w.meaning)}</div>
            <div class="w-badges">${lvlBadge(w)}${w.miss > 0 ? '<span class="badge b-bad">오답</span>' : ''}</div>
          </div>
          <div class="w-side">
            <button class="w-star ${w.star ? 'on' : ''}" data-act="star" aria-label="즐겨찾기">${IC.star}</button>
            <button class="w-speak" data-act="speak" data-text="${esc(w.word)}" aria-label="발음 듣기">${IC.speaker}</button>
          </div>
        </div>
        ${open ? `
        <div class="w-detail">
          ${w.example ? `<div class="w-ex"><h4>예문</h4><p class="ex-en">${esc(w.example)} <button class="ex-say" data-act="speak" data-text="${esc(w.example)}" aria-label="예문 듣기">${IC.speaker}</button></p>${w.exampleKo ? `<p class="ex-ko">${esc(w.exampleKo)}</p>` : '<button class="btn btn-soft btn-sm" data-act="fill-exko">예문 해석 채우기</button>'}</div>` : ''}
          ${syns.length ? `<div><h4>비슷한 단어 (눌러서 뜻 보기)</h4><div class="syn-chips">${syns.map(s => `<button class="syn" data-act="syn" data-word="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>` : ''}
          <div class="muted w-due">${dueText(w)}${w.wrong ? ` · 틀린 횟수 ${w.wrong}` : ''}</div>
          <div class="w-tools">
            <button class="btn btn-soft btn-sm" data-act="edit-word">${IC.edit} 수정</button>
            <button class="btn btn-soft btn-sm" data-act="mem">${w.box >= 5 ? '마스터 취소' : '이미 알아요'}</button>
            <button class="btn btn-soft btn-sm danger" data-act="del-word">삭제</button>
          </div>
        </div>` : ''}
      </div>`;
    }).join('');
  }

  function wordFromEl(el) {
    const card = el.closest('[data-wid]');
    const cat = curCat();
    return cat && card ? cat.words.find(w => w.id === card.dataset.wid) : null;
  }
  ACTIONS.star = el => { const w = wordFromEl(el); if (!w) return; w.star = !w.star; syncStorage(); renderWordList(); };
  ACTIONS.expand = (el, e) => {
    const w = wordFromEl(el); if (!w) return;
    const mean = el.querySelector('.w-mean');
    if (document.body.classList.contains('hide-content') && mean && !mean.classList.contains('reveal')) { mean.classList.add('reveal'); return; }
    openDrawers.has(w.id) ? openDrawers.delete(w.id) : openDrawers.add(w.id);
    renderWordList();
  };
  ACTIONS.speak = (el, e) => { e.stopPropagation(); playAudio(el.dataset.text); };
  ACTIONS.mem = el => {
    const w = wordFromEl(el); if (!w) return;
    if (w.box >= 5) { w.box = 0; w.due = 0; w.miss = 0; }
    else { w.box = 5; w.due = addDays(startOfDay(), INTERVALS[5]); w.last = dayKey(); w.miss = 0; }
    syncStorage(); renderBookDynamic();
  };
  ACTIONS['del-word'] = async el => {
    const w = wordFromEl(el), cat = curCat(); if (!w || !cat) return;
    if (!await ask(`'${w.word}' 단어를 삭제할까요?`, { ok: '삭제', danger: true })) return;
    cat.words = cat.words.filter(x => x.id !== w.id);
    syncStorage(); renderBookDynamic();
  };
  ACTIONS.syn = el => inspectSynonym(el.dataset.word);

  /* ----- 시트 ----- */
  function openSheet(title, html) {
    $('sheetTitle').textContent = title;
    $('sheetBody').innerHTML = html;
    $('sheetOv').classList.add('open');
    document.body.classList.add('no-scroll');
  }
  function closeSheet() {
    bulkCancel = true;
    $('sheetOv').classList.remove('open');
    if (!$('studyScreen').classList.contains('open')) document.body.classList.remove('no-scroll');

  function parseCsv(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = first.includes('\t') ? '\t' : ',';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch;
      } else if (ch === '"' && cur === '') q = true;
      else if (ch === delim) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(c => c.trim() !== '')) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur);
    if (row.some(c => c.trim() !== '')) rows.push(row);
    return rows;
  }
  function importCsv(e) {
    const f = e.target.files[0]; if (!f) return;
    const cat = curCat();
    const r = new FileReader();
    r.onload = ev => {
      try {
        if (!cat) throw new Error('no book');
        const buf = ev.target.result;
        let txt;
        try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
        catch (e1) { try { txt = new TextDecoder('euc-kr').decode(buf); } catch (e2) { txt = new TextDecoder('utf-8').decode(buf); } }
        let rows = parseCsv(txt);
        if (rows.length && /^(word|단어|english|term)$/i.test(str(rows[0][0]))) rows.shift();
        let added = 0, skipped = 0;
        rows.forEach(c => {
          const word = str(c[0]), meaning = str(c[1]);
          if (!word || !meaning) { skipped++; return; }
          if (cat.words.some(w => w.word.toLowerCase() === word.toLowerCase())) { skipped++; return; }
          cat.words.push(sanitizeWord({ id: uid(), word, meaning, phonetic: c[2], koreanPron: c[3], example: c[4], synonyms: c[5], exampleKo: c[6] }));
          added++;
        });
        syncStorage(); renderBookDynamic();
        toast(`${added}개 가져왔어요${skipped ? ` (건너뜀 ${skipped}개)` : ''}.`);

    };
    r.readAsArrayBuffer(f);
  }
