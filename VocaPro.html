<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-title" content="VocaPro">
  <meta name="description" content="단어, 끝까지 외우다 — VocaPro 영단어 학습">
  <title>VocaPro - 스마트 단어 마스터</title>
  <style>
    /* =====================================================
     * VocaPro 디자인 v4 · "종이 단어장" 스타일
     * 종이 배경 + 잉크 글자 + 형광펜 강조 + 인덱스 카드
     * ===================================================== */
    :root {
      --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      --serif: var(--font);
      --bg: #f2f4f6; --surface: #ffffff; --surface-2: #f2f4f6; --ink: #191f28; --ink-2: #4e5968; --muted: #8b95a1; --line: #e5e8eb;
      --blue: #3182f6; --blue-ink: #1b64da; --blue-soft: #e8f3ff;
      --navy: #191f28; --navy-2: #333d4b;
      --mark: #3182f6; --mark-ink: #ffffff; --mark-soft: #e8f3ff;
      --mint: #03b26c; --mint-soft: #e5f8ef;
      --coral: #f04452; --coral-soft: #ffeeee;
      --sun: #ff9f00; --sun-soft: #fff3e0;
      --ring: 0 0 0 3px rgba(49, 130, 246, .2);
      --shadow: 0 2px 8px rgba(0, 27, 55, .06);
      --shadow-up: 0 -8px 24px rgba(0, 27, 55, .08);
      --pop: 0 12px 32px rgba(0, 27, 55, .14);
      --r: 22px;
    }
    body.dark {
      --bg: #17171c; --surface: #202027; --surface-2: #2c2c35; --ink: #f2f4f6; --ink-2: #c3c9d0; --muted: #8b95a1; --line: #2c2c35;
      --blue: #4593fc; --blue-ink: #78b0ff; --blue-soft: #1c2a42;
      --navy: #f2f4f6; --navy-2: #c3c9d0;
      --mark: #4593fc; --mark-ink: #ffffff; --mark-soft: #1c2a42;
      --mint: #20c47f; --mint-soft: #15302a; --coral: #fa616d; --coral-soft: #3a2027; --sun: #ffb331; --sun-soft: #3a2e14;
      --ring: 0 0 0 3px rgba(69, 147, 252, .3);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-up: 0 -10px 30px rgba(0, 0, 0, .45);
      --pop: 0 16px 44px rgba(0, 0, 0, .5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--ink); max-width: 480px; margin: 0 auto; min-height: 100vh;
      padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); line-height: 1.45; letter-spacing: -0.015em;
      -webkit-font-smoothing: antialiased; transition: background .2s, color .2s;
    }
    @media (min-width: 481px) { body { box-shadow: 0 0 0 1px var(--line); } }
    body.no-scroll { overflow: hidden; }
    button, input, select, textarea { font-family: inherit; color: inherit; font-size: inherit; letter-spacing: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: none; box-shadow: var(--ring); }
    ::selection { background: var(--mark); color: var(--mark-ink); }
    .ic { width: 1.2em; height: 1.2em; flex: none; vertical-align: -.2em; }
    .muted { color: var(--muted); }
    .danger { color: var(--coral) !important; }

    /* ---------- 헤더 ---------- */
    .app-header { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .header-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 1.22rem; font-weight: 800; letter-spacing: -0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand b { font-weight: 800; color: var(--blue); }
    .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--navy); color: var(--mark); font-style: normal; font-size: 1rem; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none; letter-spacing: 0; }
    .round-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--ink); }
    .round-btn .ic { width: 19px; height: 19px; }
    .round-btn:active { transform: scale(.94); }

    .view-pane { padding: 4px 16px 20px; display: none; }
    .view-pane.active { display: block; animation: fadeUp .22s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .page-title { font-size: 1.7rem; font-weight: 800; letter-spacing: -.05em; line-height: 1.25; margin: 6px 2px 16px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin: 28px 2px 10px; font-size: 1.05rem; font-weight: 800; letter-spacing: -.035em; }
    .section-title span { background: linear-gradient(transparent 62%, var(--mark-soft) 62%); padding: 0 2px; }
    .section-title button { background: none; border: none; font-size: .84rem; font-weight: 700; color: var(--muted); }

    /* ---------- 공통 ---------- */
    .btn { border: none; border-radius: 14px; height: 52px; padding: 0 18px; font-size: 1rem; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: transform .12s, background .15s, opacity .15s; }
    .btn:active { transform: scale(.975); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn .ic { width: 17px; height: 17px; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-ink); }
    body.dark .btn-primary { color: #fff; }
    body.dark .btn-primary:hover { background: var(--blue-ink); }
    .btn-soft { background: var(--surface-2); color: var(--ink); }
    .btn-ok { background: var(--mint); color: #fff; }
    .btn-bad { background: var(--coral); color: #fff; }
    .btn-block { width: 100%; }
    .btn-sm { height: 38px; padding: 0 13px; font-size: .84rem; border-radius: 11px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; min-width: 0; }
    .link-btn { background: none; border: none; color: var(--blue); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; padding: 0 2px; }
    input[type=text], input[type=password], input[type=number], input[type=search], select, textarea {
      width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 13px; font-size: 1rem; background: var(--surface); color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
    }
    select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 19px) 50%, calc(100% - 14px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
    textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
    textarea.short { min-height: 0; resize: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: var(--ring); }
    input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
    .badge { display: inline-flex; align-items: center; font-size: .66rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; letter-spacing: .01em; }
    .b-new { background: var(--surface-2); color: var(--muted); }
    .b-learn { background: var(--blue-soft); color: var(--blue-ink); }
    .b-ok { background: var(--mint-soft); color: var(--mint); }
    .b-bad { background: var(--coral-soft); color: var(--coral); }
    .empty { text-align: center; color: var(--muted); padding: 40px 14px; font-size: .92rem; line-height: 1.7; }
    .empty b { display: block; color: var(--ink); font-size: 1rem; margin-bottom: 2px; }
    .chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 7px 14px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
    .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .seg { display: flex; background: var(--surface-2); border-radius: 13px; padding: 4px; gap: 4px; }
    .seg button { flex: 1; border: none; background: transparent; padding: 9px 4px; border-radius: 10px; font-size: .86rem; font-weight: 700; color: var(--muted); transition: background .15s, color .15s; }
    .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
    .switch-row { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; color: var(--ink-2); cursor: pointer; }
    .switch-row input { width: 18px; height: 18px; accent-color: var(--blue); flex: none; }

    /* ---------- 홈 ---------- */
    .hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 2px 14px; }
    .hello-sub { font-size: .9rem; color: var(--muted); font-weight: 600; }
    .hello-name { font-size: 1.55rem; font-weight: 800; letter-spacing: -.05em; line-height: 1.25; word-break: break-all; }
    .grade-chip { flex: none; border: none; background: var(--mark); color: var(--mark-ink); font-weight: 800; font-size: .85rem; padding: 7px 12px; border-radius: 10px; }
    .hero { position: relative; overflow: hidden; border-radius: 24px; padding: 20px 20px 18px; color: #fff; background: var(--navy);
      background-image: repeating-linear-gradient(transparent 0 31px, rgba(255, 255, 255, .055) 31px 32px); }
    .hero::before { content: ''; position: absolute; left: 30px; top: 0; bottom: 0; width: 1.5px; background: rgba(255, 110, 110, .35); }
    .hero > * { position: relative; }
    .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-left: 22px; }
    .hero-label { font-size: .88rem; font-weight: 700; opacity: .8; }
    .hero-num { font-size: 3.2rem; font-weight: 900; letter-spacing: -.06em; line-height: 1.05; margin-top: 2px; }
    .hero-num small { font-size: 1.05rem; font-weight: 700; margin-left: 4px; opacity: .8; letter-spacing: 0; }
    .hero-sub { font-size: .86rem; opacity: .78; margin: 8px 0 14px 22px; line-height: 1.5; }
    .hero-mission { display: flex; gap: 6px; margin: 0 0 14px 22px; flex-wrap: wrap; }
    .hero-mission span { background: rgba(255, 255, 255, .1); border-radius: 8px; padding: 4px 9px; font-size: .78rem; font-weight: 600; }
    .hero-mission b { color: var(--mark); font-weight: 800; }
    .hero-btn { background: var(--mark); color: var(--mark-ink); font-weight: 800; font-size: 1.04rem; }
    .hero-btn:hover { filter: brightness(1.03); }
    .ring-box { position: relative; width: 82px; height: 82px; flex-shrink: 0; }
    .ring { width: 82px; height: 82px; }
    .ring-bg { fill: none; stroke: rgba(255, 255, 255, .16); stroke-width: 8; }
    .ring-fg { fill: none; stroke: var(--mark); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .6s; }
    .ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .7rem; font-weight: 700; line-height: 1.15; opacity: .9; }
    .ring-txt b { font-size: 1.15rem; font-weight: 900; }

    .streak-card { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 14px 16px; }
    .streak-fire { width: 40px; height: 40px; border-radius: 12px; background: var(--sun-soft); color: var(--sun); display: flex; align-items: center; justify-content: center; flex: none; }
    .streak-fire .ic { width: 22px; height: 22px; }
    .streak-txt { min-width: 64px; } .streak-txt .muted { font-size: .74rem; font-weight: 600; }
    .streak-n { font-size: 1.05rem; font-weight: 800; letter-spacing: -.03em; }
    .week { display: flex; justify-content: space-between; flex: 1; gap: 2px; }
    .day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .66rem; font-weight: 700; color: var(--muted); }
    .day i { width: 24px; height: 24px; border-radius: 8px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--mark-ink); }
    .day i .ic { width: 14px; height: 14px; }
    .day.done i { background: var(--mark); }
    .day.today { color: var(--ink); }
    .day.today i { box-shadow: 0 0 0 2px var(--ink); }

    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; transition: transform .12s; }
    .tile:active { transform: scale(.98); }
    .tile-ico { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex: none; background: var(--blue-soft); color: var(--blue); }
    .tile-ico .ic { width: 20px; height: 20px; }
    .tile-ico.t-wrong { background: var(--coral-soft); color: var(--coral); }
    .tile-ico.t-star { background: var(--sun-soft); color: var(--sun); }
    .tile-name { font-weight: 800; font-size: .92rem; letter-spacing: -.03em; }
    .tile-n { font-size: .76rem; color: var(--muted); font-weight: 600; }
    .tool-list { display: flex; flex-direction: column; gap: 8px; }
    .mg-entry { width: 100%; display: flex; align-items: center; gap: 13px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); text-align: left; transition: transform .12s; }
    .mg-entry:active { transform: scale(.985); }
    .mg-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); color: var(--ink); display: flex; align-items: center; justify-content: center; flex: none; }
    .mg-ico .ic { width: 20px; height: 20px; }
    .mg-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .mg-txt b { font-size: .98rem; font-weight: 800; letter-spacing: -.03em; }
    .mg-txt small { color: var(--muted); font-size: .8rem; }
    .mg-chev { width: 8px; height: 8px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); margin-right: 4px; flex: none; }

    /* ---------- 단어장 목록 ---------- */
    .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .add-row .btn { flex: none; }
    .book-list { display: flex; flex-direction: column; gap: 8px; }
    .book { display: flex; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform .12s; }
    .book:active { transform: scale(.985); }
    .book-spine { width: 62px; flex: none; background: var(--bk, var(--blue)); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
    .book-spine::after { content: ''; position: absolute; right: 6px; top: 8px; bottom: 8px; border-right: 1.5px dashed rgba(255, 255, 255, .35); }
    .book-spine b { font-size: 1.25rem; font-weight: 900; letter-spacing: -.04em; line-height: 1.1; }
    .book-spine small { font-size: .64rem; font-weight: 700; opacity: .85; }
    .book-body { flex: 1; min-width: 0; padding: 13px 14px 14px; }
    .book-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .book-name { font-size: 1.02rem; font-weight: 800; letter-spacing: -.035em; word-break: break-word; }
    .book-meta { font-size: .76rem; color: var(--muted); font-weight: 600; margin: 2px 0 9px; }
    .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--bk, var(--mint)); border-radius: 99px; transition: width .4s; }

    /* ---------- 단어장 상세 ---------- */
    .book-sum { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px; }
    .sum-box { padding: 12px 6px; text-align: center; }
    .sum-box + .sum-box { border-left: 1px solid var(--line); }
    .sum-box b { display: block; font-size: 1.3rem; font-weight: 900; letter-spacing: -.04em; }
    .sum-box span { font-size: .72rem; color: var(--muted); font-weight: 700; }
    .book-actions { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .book-actions .btn { height: 46px; padding: 0 6px; font-size: .88rem; }
    .toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
    .toolbar input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; }
    .icon-btn { width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); color: var(--ink); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn .ic { width: 19px; height: 19px; }
    .icon-btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .word-list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-bottom: 84px; }
    .word-list:has(.empty) { background: transparent; border: none; }
    .wcard { border-bottom: 1px solid var(--line); padding: 13px 12px 13px 0; }
    .wcard:last-child { border-bottom: none; }
    .wcard.open { background: color-mix(in srgb, var(--surface-2) 45%, var(--surface)); }
    .wcard.mastered .w-word, .wcard.mastered .w-mean { opacity: .55; }
    .w-row { display: flex; align-items: flex-start; gap: 4px; }
    .w-no { width: 42px; flex: none; text-align: center; font-size: .72rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 5px; letter-spacing: 0; }
    .w-main { flex: 1; min-width: 0; cursor: pointer; }
    .w-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 7px; }
    .w-word { font-size: 1.2rem; font-weight: 800; letter-spacing: -.02em; word-break: break-word; }
    .w-word.hl { background: linear-gradient(transparent 55%, var(--mark) 55%); padding: 0 2px; margin: 0 -2px; }
    .w-pron { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .w-kpron { font-size: .78rem; color: var(--blue); font-weight: 700; }
    .w-mean { font-size: .96rem; font-weight: 600; color: var(--ink-2); margin-top: 2px; transition: filter .15s; }
    body.hide-content .w-mean:not(.reveal) { filter: blur(6px); user-select: none; }
    .w-badges { display: flex; gap: 4px; margin-top: 6px; }
    .w-side { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
    .w-star, .w-speak { width: 36px; height: 34px; border: none; background: none; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; }
    .w-star .ic, .w-speak .ic { width: 19px; height: 19px; }
    .w-star.on { color: var(--sun); } .w-star.on .ic { fill: currentColor; }
    .w-speak { color: var(--blue); }
    .w-detail { margin: 12px 0 2px 46px; display: flex; flex-direction: column; gap: 12px; font-size: .9rem; }
    .w-detail h4 { font-size: .72rem; color: var(--muted); font-weight: 800; letter-spacing: .04em; margin-bottom: 4px; }
    .w-ex { border-left: 3px solid var(--mark); padding: 2px 0 2px 12px; }
    .ex-en { font-weight: 600; line-height: 1.55; color: var(--ink); }
    .ex-ko { display: block; color: var(--muted); line-height: 1.55; margin-top: 2px; }
    .w-ex .btn-sm { margin-top: 8px; }
    .ex-say { border: none; background: none; color: var(--blue); vertical-align: middle; padding: 0 2px; }
    .ex-say .ic { width: 16px; height: 16px; }
    .w-due { font-size: .78rem; }
    .syn-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .syn-ex { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: .95rem; line-height: 1.5; }
    .syn-ex small { display: block; margin-top: 4px; color: var(--ink-2); font-size: .85rem; }
    .syn-h { margin: 16px 0 8px; font-size: .85rem; color: var(--ink-2); }
    .syn { background: var(--blue-soft); color: var(--blue-ink); border: none; border-radius: 9px; padding: 5px 10px; font-size: .82rem; font-weight: 700; }
    .w-tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .note-box { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; line-height: 1.55; }
    .note-box ul { padding-left: 18px; }

    /* ---------- 로그인 ---------- */

    /* ---------- 번역 시트 ---------- */

    /* =====================================================

    .toolbar input { background: var(--surface); }
    .card, .tile, .mg-entry, .book, .book-sum, .word-list, .icon-btn, .src, .mode, .q-card, .opt, .stat-tile, .settings-card, .menu-list, .auth-box,

    /* 시트 · 대화상자 · 로그인 · 탭 */

    .auth-box { box-shadow: none; padding: 20px 4px; background: transparent; }
    .auth-box .page-title b { color: var(--blue); }

    .kid-note { background: var(--blue-soft); color: var(--blue-ink); border-radius: 16px; padding: 12px 14px; }

    body.dark .auth { background: var(--bg); }
    body.dark .toast { background: #3a3a45; }
    .rec-tabs .chip.pack, body.dark .rec-tabs .chip.pack { border-color: transparent; background: var(--blue-soft); color: var(--blue-ink); }
    .rec-tabs .chip.pack.on, body.dark .rec-tabs .chip.pack.on { background: var(--blue); color: #fff; }
    /* =====================================================
     * 디자인 다듬기: 마스코트, 입체 버튼, 정답 피드백, 컬러 아이콘
     * ===================================================== */
    :root { --grape: #7b61ff; --grape-soft: #f0edff; --teal: #00a5b8; --teal-soft: #e2f6f8; --fire: #ff7a1a;
      --sh-ok: #029359; --sh-bad: #d22c3b; --sh-blue: #1957c2; --sh-line: #dfe3e8; }
    body.dark { --grape: #9d8bff; --grape-soft: #29243f; --teal: #2cc3d4; --teal-soft: #12303a; --fire: #ff9433;
      --sh-ok: #12865a; --sh-bad: #b5323f; --sh-blue: #275fc0; --sh-line: #111116; }
    body.dark .btn-primary:hover { background: #2f7ae8; }

    .mascot { display: block; width: 120px; height: 120px; overflow: visible; color: var(--ink); }
    .ob-art .mascot, .result-art .mascot { animation: bob 4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @media (prefers-reduced-motion: reduce) { .mascot, .ob-art, .result-art { animation: none !important; } }
    .ob-art, .result-art { position: relative; width: 148px; height: 148px; border-radius: 50%; background: var(--blue-soft); display: flex; align-items: center; justify-content: center; flex: none; animation: pop .45s cubic-bezier(.2, .9, .3, 1.2); }
    .ob-art { margin-bottom: 28px; }
    .ob-art .mascot, .result-art .mascot { width: 112px; height: 112px; margin-top: 8px; }
    .ob-badge { position: absolute; right: 0; bottom: 6px; width: 46px; height: 46px; border-radius: 50%; background: var(--surface); color: var(--blue); box-shadow: 0 6px 16px rgba(0, 27, 55, .14); display: flex; align-items: center; justify-content: center; }
    .ob-badge .ic { width: 22px; height: 22px; }
    .result-art { margin: 6px auto 14px; }
    .auth-hero { display: flex; justify-content: center; margin-bottom: 4px; }
    .auth-hero .mascot { width: 96px; height: 96px; }
    .auth-box .page-title::before { display: none; }
    .empty .mascot { width: 96px; height: 96px; margin: 0 auto 12px; }
    .card .empty .mascot { width: 64px; height: 64px; margin-bottom: 6px; }

    /* 홈 */
    .hello { align-items: center; }

    .hello-who .mascot { width: 52px; height: 52px; flex: none; margin-top: -4px; }
    .hero { background: linear-gradient(140deg, #4a95ff 0%, #2b6ef0 55%, #1f5fe0 100%); color: #fff; box-shadow: 0 16px 32px -16px rgba(33, 99, 230, .6); }
    .hero::before { display: block; left: auto; right: -70px; top: -80px; bottom: auto; width: 230px; height: 230px; border-radius: 50%; background: rgba(255, 255, 255, .09); z-index: 0; }
    .hero::after { content: ''; position: absolute; left: -50px; bottom: -110px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255, 255, 255, .06); z-index: 0; }
    .hero > * { z-index: 1; }
    .hero-label, .hero-sub { color: rgba(255, 255, 255, .88); }
    .hero-num { color: #fff; }
    .hero-num small { color: rgba(255, 255, 255, .8); }
    .hero-mission span { background: rgba(255, 255, 255, .16); color: rgba(255, 255, 255, .92); }
    .hero-mission b { color: #fff; }
    .hero-btn { background: #fff; color: #1b64da; font-weight: 700; box-shadow: 0 4px 0 rgba(8, 38, 110, .28); transition: transform .1s, box-shadow .1s; }
    .hero-btn:hover { background: #fff; filter: none; }
    .hero-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(8, 38, 110, .28); }
    .ring-bg { stroke: rgba(255, 255, 255, .22); }
    .ring-fg { stroke: #fff; }
    .ring-txt { color: #fff; }
    body.dark .hero { background: linear-gradient(140deg, #3b80ec 0%, #2560cf 60%, #1d4fae 100%); box-shadow: none; }
    .streak-fire { border-radius: 50%; background: linear-gradient(160deg, #ffb547, var(--fire)); color: #fff; box-shadow: 0 6px 14px -6px rgba(255, 122, 26, .8); }
    .streak-fire.off { background: var(--surface-2); color: var(--muted); box-shadow: none; }
    .day.done i { background: linear-gradient(160deg, #ffb547, var(--fire)); }
    .day.today i { box-shadow: 0 0 0 2px var(--fire); }
    .tile-ico.t-new, .mg-ico.i-mint { background: var(--mint-soft); color: var(--mint); }
    .tile-ico.t-listen, .mg-ico.i-grape { background: var(--grape-soft); color: var(--grape); }
    .mg-ico.i-teal { background: var(--teal-soft); color: var(--teal); }
    .mg-ico.i-sun { background: var(--sun-soft); color: var(--sun); }
    .mg-ico.i-coral { background: var(--coral-soft); color: var(--coral); }
    .mode[data-mode="choice"] .ico { background: var(--mint-soft); color: var(--mint); }
    .mode[data-mode="rchoice"] .ico { background: var(--grape-soft); color: var(--grape); }
    .mode[data-mode="spell"] .ico { background: var(--sun-soft); color: var(--sun); }

    .nav-brand, .nav-card, .kbd-hint { display: none; }
    .add-row input { background: var(--surface); }

    /* 학습 화면 */
    .prog { height: 12px; background: var(--line); }
    .prog i { position: relative; min-width: 12px; background: linear-gradient(90deg, #6aaeff, var(--blue)); }
    .prog i::after { content: ''; position: absolute; left: 6px; right: 6px; top: 3px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
    .q-foot { padding-bottom: 4px; }
    .q-foot .btn, .ob-foot .btn, .result .btn, .mg-done .btn { transition: transform .08s, box-shadow .08s, background .15s; }
    .q-foot .btn-ok { box-shadow: 0 4px 0 var(--sh-ok); }
    .q-foot .btn-bad { box-shadow: 0 4px 0 var(--sh-bad); }
    .q-foot .btn-primary, .ob-foot .btn-primary, .result .btn-primary, .mg-done .btn-primary { box-shadow: 0 4px 0 var(--sh-blue); }
    .q-foot .btn-soft, .ob-foot .btn-soft, .result .btn-soft, .mg-done .btn-soft { background: var(--surface); color: var(--ink-2); box-shadow: 0 4px 0 var(--sh-line); }
    .q-foot .btn:active, .ob-foot .btn:active, .result .btn:active, .mg-done .btn:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; }
    .opt { border: 2px solid var(--line) !important; box-shadow: 0 3px 0 var(--sh-line); padding: 14px 16px; transition: transform .08s, box-shadow .08s, background .15s, border-color .15s, opacity .2s; }
    .opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
    .opt-n { background: var(--surface); border: 2px solid var(--line); color: var(--ink-2); width: 28px; height: 28px; position: relative; }
    .opt:disabled:not(.correct):not(.wrong) { opacity: .45; }
    .opt.correct { background: var(--mint-soft); border-color: var(--mint) !important; box-shadow: 0 3px 0 var(--mint); animation: optPop .34s cubic-bezier(.2, .9, .3, 1.3); }
    .opt.wrong { background: var(--coral-soft); border-color: var(--coral) !important; box-shadow: 0 3px 0 var(--coral); animation: mshake .35s; }
    .opt.correct .opt-n, .opt.wrong .opt-n { font-size: 0; border-color: transparent; }
    .opt.correct .opt-n::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.6px 2.6px 0; transform: translateY(-1px) rotate(45deg); }
    .opt.wrong .opt-n::before, .opt.wrong .opt-n::after { content: ''; position: absolute; left: 50%; top: 50%; width: 12px; height: 2.6px; margin: -1.3px 0 0 -6px; border-radius: 2px; background: #fff; transform: rotate(45deg); }
    .opt.wrong .opt-n::after { transform: rotate(-45deg); }
    @keyframes optPop { 45% { transform: scale(1.03); } }
    .ans-bar { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 20px; animation: ansUp .28s cubic-bezier(.2, .9, .3, 1.15); }
    .ans-bar.ok, .fb.ok { background: var(--mint-soft); color: var(--mint); }
    .ans-bar.bad, .fb.bad { background: var(--coral-soft); color: var(--coral); }
    .ans-ic { width: 40px; height: 40px; border-radius: 50%; background: currentColor; display: flex; align-items: center; justify-content: center; flex: none; }
    .ans-ic .ic { color: #fff; width: 22px; height: 22px; }
    .ans-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .ans-t b { font-size: 1.08rem; font-weight: 800; }
    .ans-t span { font-size: .86rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ans-combo { flex: none; font-size: .76rem; font-weight: 800; color: var(--fire); background: var(--surface); padding: 6px 10px; border-radius: 99px; }
    @keyframes ansUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .fb { display: flex; align-items: flex-start; gap: 12px; animation: ansUp .28s cubic-bezier(.2, .9, .3, 1.15); }
    .fb .ans-ic { width: 34px; height: 34px; }
    .fb .ans-ic .ic { width: 19px; height: 19px; }
    .type-input { background: var(--surface) !important; border: 2px solid var(--line) !important; box-shadow: 0 3px 0 var(--sh-line); }
    .type-input:focus { border-color: var(--blue) !important; }
    .fc-face { border: 2px solid var(--line) !important; background: linear-gradient(180deg, var(--blue-soft) 0, var(--surface) 42%); box-shadow: 0 5px 0 var(--sh-line), 0 22px 40px -22px rgba(0, 27, 55, .3); }
    .fc-back { background: linear-gradient(180deg, var(--mint-soft) 0, var(--surface) 42%); }
    .fc-face::before { content: '단어'; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: .74rem; font-weight: 800; letter-spacing: .08em; color: var(--blue); background: var(--surface); padding: 4px 12px; border-radius: 99px; }
    .fc-back::before { content: '뜻'; color: var(--mint); }
    .sw-hint span { padding: 6px 12px; border-radius: 99px; font-size: .78rem; }
    .sw-hint .no { background: var(--coral-soft); }
    .sw-hint .ok { background: var(--mint-soft); }
    .sw-badge { border: none; color: #fff !important; padding: 8px 16px; border-radius: 14px; font-size: 1.05rem; box-shadow: var(--pop); }
    .sw-badge.ok { background: var(--mint); }
    .sw-badge.no { background: var(--coral); }
    .q-speak { border-radius: 50%; box-shadow: 0 3px 0 color-mix(in srgb, var(--blue) 25%, transparent); }
    .q-speak:active { transform: translateY(2px); box-shadow: none; }
    .result h2 { font-size: 1.6rem; }
    .result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 4px; }
    .result-stats div { background: var(--surface); border-radius: 18px; padding: 12px 6px; display: flex; flex-direction: column; gap: 2px; }
    .result-stats b { font-size: 1.15rem; font-weight: 800; letter-spacing: -.03em; }
    .result-stats span { font-size: .74rem; color: var(--muted); font-weight: 600; }

  const TK = 'vocapro_tok';
  const hdr = { apikey: cfg.apiKey, 'Content-Type': 'application/json' };
  if (/^eyJ/.test(cfg.apiKey)) hdr.Authorization = 'Bearer ' + cfg.apiKey;
  const getTok = () => { try { return localStorage.getItem(TK) || sessionStorage.getItem(TK); } catch (e) { return null; } };
  const setTok = (t, keep) => { try { localStorage.removeItem(TK); sessionStorage.removeItem(TK); if (t) (keep ? localStorage : sessionStorage).setItem(TK, t); } catch (e) {} };
  async function rpc(fn, args) {
    let r;
    try { r = await fetch(cfg.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers: hdr, body: JSON.stringify(args) }); }
    catch (e) { throw { code: 'network', message: String(e.message || e) }; }
    const t = await r.text(); let j = null; try { j = JSON.parse(t); } catch (e) {}
    if (!r.ok) throw { code: r.status === 404 ? 'missing' : 'server', status: r.status, message: (j && (j.message || j.hint)) || t.slice(0, 150) };
    if (j && j.err) throw { code: j.err, message: j.err };
    return j;
  }
  let cur = null;
  const me = j => ({ uid: String(j.id), email: j.username });
  const first = (async () => {
    const t = getTok(); if (!t) return null;
    try { cur = me(await rpc('voca_me', { p_token: t })); return cur; }
    catch (e) {
      if (e.code === 'network') {
        try { const id = localStorage.getItem('vocapro_last_uid'); if (id) { cur = { uid: id, email: localStorage.getItem('vocapro_last_label') || '' }; return cur; } } catch (x) {}
        return null;
      }
      setTok(null); return null;
    }
  })();
  async function enter(fn, e, p, k) { const j = await rpc(fn, { p_user: e, p_pw: p }); setTok(j.token, k !== false); cur = me(j); return cur; }
  window.Cloud = {
    first, user: () => cur,
    signup: (e, p, k) => enter('voca_signup', e, p, k),
    login: (e, p, k) => enter('voca_login', e, p, k),
    async logout() { const t = getTok(); setTok(null); cur = null; if (t) { try { await rpc('voca_logout', { p_token: t }); } catch (e) {} } },
    async reset() { throw { code: 'bad_input' }; },
    async load() { const j = await rpc('voca_load', { p_token: getTok() }); return j && j.data ? { data: j.data, updated: Number(j.updated) } : null; },
    save: d => rpc('voca_save', { p_token: getTok(), p_data: d.data, p_updated: d.updated }),
    changePw: (o, n) => rpc('voca_change_pw', { p_token: getTok(), p_old: o, p_new: n }),
    call: (fn, args) => rpc(fn, Object.assign({ p_token: getTok() }, args || {})),
    async remove() { await rpc('voca_delete', { p_token: getTok() }); setTok(null); cur = null; },
    async ai(prompt, task) {
      let r; const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 20000);
      try { r = await fetch(cfg.url.replace(/\/+$/, '') + '/functions/v1/ai', { method: 'POST', headers: hdr, body: JSON.stringify(Object.assign({ token: getTok(), prompt }, task || {})), signal: ctl.signal }); }
      catch (e) {
        clearTimeout(tm);
        const x = new Error(e && e.name === 'AbortError' ? 'AI 응답이 20초 넘게 없어요. 다시 시도해 주세요.' : '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.');
        x.status = e && e.name === 'AbortError' ? 408 : 0; throw x;
      }
      clearTimeout(tm);
      let j = null; try { j = await r.json(); } catch (e) {}
      if (!r.ok || !j || typeof j.text !== 'string') {
        const m = r.status === 404 ? '서버 AI가 아직 준비되지 않았어요. 설정에서 내 API 키를 입력하면 바로 쓸 수 있어요.' : r.status === 429 ? ((j && j.error) || '오늘 AI 사용 한도를 다 썼어요. 내일 다시 쓸 수 있어요.') : (j && j.error) || 'AI 호출에 실패했어요.';
        const x = new Error(m); x.status = r.status; throw x;
      }
      return j.text;
    }
  };
  window.dispatchEvent(new Event('cloudready'));
})();

  function sanitizeNote(n) {

  function splitExample(en, ko) {

    return `<svg class="ring" viewBox="0 0 84 84"><circle class="ring-bg" cx="42" cy="42" r="${r}"/><circle class="ring-fg" cx="42" cy="42" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c * (1 - pct)).toFixed(1)}" transform="rotate(-90 42 42)"/></svg>`;
  }

    const gname = GRADE_NAMES[config.grade];
    const books = categories.slice(0, 3).map(bookCardHtml).join('');

    $('tabHome').innerHTML = `

        <button class="grade-chip" data-act="grade-pick">${isTeacher() ? '선생님' : gname ? esc(gname) : '학년 설정'}</button></div></div>
      <div class="h-hero"><section class="hero">
        <div class="hero-top">

        </div>
        <div class="hero-sub">${cta.sub}</div>
        <div class="hero-mission"><span>복습 <b>${c.due}</b></span><span>새 단어 <b>${c.newW}</b></span><span>마스터 <b>${c.mastered}</b></span></div>
        <button class="btn hero-btn btn-block" ${cta.attrs}>${cta.btn}</button>
      </section></div>

      <div class="h-streak"><div class="card streak-card">
        <div class="streak-fire ${st > 0 ? '' : 'off'}">${st > 0 ? IC.flame : IC.sprout}</div>
        <div class="streak-txt"><div class="streak-n">${st}일 연속</div><div class="muted">${st > 0 ? '학습 중이에요' : '오늘 시작해요'}</div></div>

      <div class="tiles">
        <button class="tile" data-act="start" data-mode="card" data-src="new"><div class="tile-ico t-new">${IC.sprout}</div><div><div class="tile-name">새 단어</div><div class="tile-n">${c.newW}개</div></div></button>
        <button class="tile" data-act="start" data-mode="choice" data-src="wrong"><div class="tile-ico t-wrong">${IC.bookx}</div><div><div class="tile-name">오답노트</div><div class="tile-n">${c.miss}개</div></div></button>
        <button class="tile" data-act="start" data-mode="card" data-src="star"><div class="tile-ico t-star">${IC.star}</div><div><div class="tile-name">즐겨찾기</div><div class="tile-n">${c.star}개</div></div></button>

      </div></div>

      <div class="tool-list">${isTeacher() ? '' : classEntryHtml()}${flowEntryHtml()}<button class="mg-entry" data-act="match"><span class="mg-ico i-grape">${IC.cards}</span><span class="mg-txt"><b>짝 맞추기</b><small>영어와 뜻을 빠르게 연결해요</small></span><span class="mg-chev"></span></button><button class="mg-entry" data-act="exam-open"><span class="mg-ico i-coral">${IC.trophy}</span><span class="mg-txt"><b>실전 시험</b><small>섞인 문제를 풀고 점수와 등급을 받아요</small></span><span class="mg-chev"></span></button><button class="mg-entry" data-act="dict-open"><span class="mg-ico i-teal">${IC.search}</span><span class="mg-txt"><b>영어사전</b><small>뜻, 예문, 비슷한 단어를 바로 찾아요</small></span><span class="mg-chev"></span></button>${recEntryHtml()}${packEntryHtml()}${ltEntryHtml()}</div></div>

      </div>
    `;
    recMaybeShow(); wotdFill();

  ACTIONS.start = el => startSession(el.dataset.mode, parseSrc(el.dataset.src), el.dataset.count !== undefined ? parseInt(el.dataset.count, 10) : SESSION_DEFAULT);

  /* =========================================================

  function bookCardHtml(b) {
    const total = b.words.length;
    const mastered = b.words.filter(w => w.box >= 5).length;
    const end = endOfToday();
    const due = b.words.filter(w => w.box >= 1 && w.due <= end).length;
    const pct = total ? Math.round(mastered / total * 100) : 0;
    return `
      <div class="book" style="--bk:${bookColor(b.id)}" data-act="open-book" data-id="${esc(b.id)}">
        <div class="book-spine"><b>${total}</b><small>단어</small></div>
        <div class="book-body">
          <div class="book-top"><span class="book-name">${esc(b.name)}</span>${due ? `<span class="badge b-learn">복습 ${due}</span>` : ''}</div>
          <div class="book-meta">마스터 ${mastered}개 · ${pct}%</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>
      </div>`;
  }
  function renderBooks() {

  function onSearch(v) { currentFilter = v.trim(); renderWordList(); }

  const FILTERS = [['all', '전체'], ['new', '새 단어'], ['learning', '학습 중'], ['mastered', '마스터'], ['star', '즐겨찾기'], ['miss', '오답']];
  function renderBookDynamic() {
    const cat = curCat();
    if (!cat) return go('tabBooks');
    const end = endOfToday();
    const total = cat.words.length, mastered = cat.words.filter(w => w.box >= 5).length;
    const due = cat.words.filter(w => w.box >= 1 && w.due <= end).length;
    $('bookSummary').innerHTML = `<div class="sum-box"><b>${total}</b><span>전체</span></div><div class="sum-box"><b>${mastered}</b><span>마스터</span></div><div class="sum-box"><b>${due}</b><span>오늘 복습</span></div>`;
    $('bookChips').innerHTML = FILTERS.map(([k, n]) => `<button class="chip ${bookFilter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${n}</button>`).join('');
    renderWordList();
  }
  ACTIONS.filter = el => { bookFilter = el.dataset.f; renderBookDynamic(); };
  ACTIONS.shuffle = () => {
    const cat = curCat();
    if (!cat || cat.words.length <= 1) return;
    viewOrder = shuffled(cat.words.map(w => w.id));
    renderWordList(); toast('순서를 섞었어요.');
  };
  ACTIONS.blur = () => {
    document.body.classList.toggle('hide-content');
    const b = $('btnBlurToggle');
    if (b) b.classList.toggle('on', document.body.classList.contains('hide-content'));
    renderWordList();
  };

  function visibleWords() {
    const cat = curCat();
    if (!cat) return [];
    let list = [...cat.words];
    if (viewOrder) {
      const pos = new Map(viewOrder.map((id, i) => [id, i]));
      list.sort((a, b) => (pos.has(a.id) ? pos.get(a.id) : -1) - (pos.has(b.id) ? pos.get(b.id) : -1));
    }
    list = list.filter(w => {
      if (bookFilter === 'new') return w.box === 0;
      if (bookFilter === 'learning') return w.box >= 1 && w.box < 5;
      if (bookFilter === 'mastered') return w.box >= 5;
      if (bookFilter === 'star') return w.star;
      if (bookFilter === 'miss') return w.miss > 0;
      return true;
    });
    if (currentFilter) {
      const q = currentFilter.toLowerCase();
      list = list.filter(w => w.word.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q));
    }
    return list;
  }
  function lvlBadge(w) {
    if (w.box === 0) return '<span class="badge b-new">NEW</span>';
    if (w.box >= 5) return '<span class="badge b-ok">마스터</span>';
    return `<span class="badge b-learn">Lv.${w.box}</span>`;
  }
  function noteHtml(n) {
    if (!n) return '';
    let h = '<div class="note-box">';
    if (n.etymology) h += `<div><h4>어원 · 구조</h4>${esc(n.etymology)}</div>`;
    if (n.tip) h += `<div><h4>암기 팁</h4>${esc(n.tip)}</div>`;
    if (n.examples.length) h += `<div><h4>예문</h4><ul>${n.examples.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
    if (n.confusable.length) h += `<div><h4>헷갈리는 단어</h4><ul>${n.confusable.map(c => `<li><b>${esc(c.word)}</b> ${esc(c.meaning)} · ${esc(c.diff)}</li>`).join('')}</ul></div>`;
    return h + '</div>';
  }

  function renderWordList() {
    const box = $('wordCardStream');
    if (!box) return;
    const list = visibleWords();
    if (!list.length) {
      const cat = curCat();
      box.innerHTML = (cat && cat.words.length === 0)
        ? emptyHtml('첫 단어를 추가해 볼까요?', '오른쪽 아래 + 버튼을 눌러 단어를 넣으면 뜻과 예문을 채워줘요.', 'happy')
        : emptyHtml('조건에 맞는 단어가 없어요', '필터나 검색어를 바꿔 보세요.', 'think');
      return;
    }
    box.innerHTML = list.map((w, i) => {
      const syns = w.synonyms.split(',').map(s => s.trim()).filter(Boolean);
      const open = openDrawers.has(w.id);
      return `
      <div class="wcard ${w.box >= 5 ? 'mastered' : ''} ${open ? 'open' : ''}" data-wid="${esc(w.id)}">
        <div class="w-row">
          <span class="w-no">${String(i + 1).padStart(3, '0')}</span>
          <div class="w-main" data-act="expand">
            <div class="w-head"><span class="w-word ${w.star ? 'hl' : ''}">${esc(w.word)}</span>${w.phonetic ? `<span class="w-pron">${esc(w.phonetic)}</span>` : ''}${w.koreanPron ? `<span class="w-kpron">[${esc(w.koreanPron)}]</span>` : ''}</div>
            <div class="w-mean">${esc(w.meaning)}</div>
            <div class="w-badges">${lvlBadge(w)}${w.miss > 0 ? '<span class="badge b-bad">오답</span>' : ''}</div>
          </div>
          <div class="w-side">
            <button class="w-star ${w.star ? 'on' : ''}" data-act="star" aria-label="즐겨찾기">${IC.star}</button>
            <button class="w-speak" data-act="speak" data-text="${esc(w.word)}" aria-label="발음 듣기">${IC.speaker}</button>
          </div>
        </div>
        ${open ? `
        <div class="w-detail">
          ${w.example ? `<div class="w-ex"><h4>예문</h4><p class="ex-en">${esc(w.example)} <button class="ex-say" data-act="speak" data-text="${esc(w.example)}" aria-label="예문 듣기">${IC.speaker}</button></p>${w.exampleKo ? `<p class="ex-ko">${esc(w.exampleKo)}</p>` : '<button class="btn btn-soft btn-sm" data-act="fill-exko">예문 해석 채우기</button>'}</div>` : ''}
          ${syns.length ? `<div><h4>비슷한 단어 (눌러서 뜻 보기)</h4><div class="syn-chips">${syns.map(s => `<button class="syn" data-act="syn" data-word="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>` : ''}
          <div class="muted w-due">${dueText(w)}${w.wrong ? ` · 틀린 횟수 ${w.wrong}` : ''}</div>
          <div class="w-tools">
            <button class="btn btn-soft btn-sm" data-act="edit-word">${IC.edit} 수정</button>
            <button class="btn btn-soft btn-sm" data-act="mem">${w.box >= 5 ? '마스터 취소' : '이미 알아요'}</button>

  function wordFromEl(el) {
    const card = el.closest('[data-wid]');
    const cat = curCat();
    return cat && card ? cat.words.find(w => w.id === card.dataset.wid) : null;
  }
  ACTIONS.star = el => { const w = wordFromEl(el); if (!w) return; w.star = !w.star; syncStorage(); renderWordList(); };

    openDrawers.has(w.id) ? openDrawers.delete(w.id) : openDrawers.add(w.id);
    renderWordList();
  };
  ACTIONS.speak = (el, e) => { e.stopPropagation(); playAudio(el.dataset.text); };
  ACTIONS.mem = el => {
    const w = wordFromEl(el); if (!w) return;
    if (w.box >= 5) { w.box = 0; w.due = 0; w.miss = 0; }
    else { w.box = 5; w.due = addDays(startOfDay(), INTERVALS[5]); w.last = dayKey(); w.miss = 0; }
    syncStorage(); renderBookDynamic();
  };
  ACTIONS['del-word'] = async el => {
    const w = wordFromEl(el), cat = curCat(); if (!w || !cat) return;

  function parseCsv(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = first.includes('\t') ? '\t' : ',';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch;
      } else if (ch === '"' && cur === '') q = true;
      else if (ch === delim) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(c => c.trim() !== '')) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur);
    if (row.some(c => c.trim() !== '')) rows.push(row);
    return rows;
  }

      <div class="src-row">${srcs.map(s => `<button class="src ${studyPrefs.src === s.k ? 'on' : ''}" data-act="pick-src" data-k="${esc(s.k)}"><span>${esc(s.n)}</span><b>${s.c}</b></button>`).join('')}</div>
      <div class="section-title" style="margin-top:14px;"><span>한 번에 학습할 개수</span></div>
      <div class="seg">${counts4.map(([v, n]) => `<button class="${studyPrefs.count === v ? 'on' : ''}" data-act="pick-count" data-v="${v}">${n}</button>`).join('')}</div>
      <div class="section-title"><span>학습 방법</span></div>
      <div class="modes">${Object.keys(MODES).map(k => `<button class="mode" data-act="study-start" data-mode="${k}"><span class="ico">${MODES[k].ico}</span><b>${MODES[k].name}</b><span>${MODES[k].desc}</span></button>`).join('')}</div>`;
  }
  ACTIONS['pick-src'] = el => { studyPrefs.src = el.dataset.k; renderStudy(); };
  ACTIONS['pick-count'] = el => { studyPrefs.count = parseInt(el.dataset.v, 10); renderStudy(); };
  ACTIONS['study-start'] = el => startSession(el.dataset.mode, parseSrc(studyPrefs.src), studyPrefs.count);

  /* =========================================================
   * 학습 세션 엔진
   * ======================================================= */
  let S = { active: false };

  function startSession(mode, src, count, override) {
    if (!MODES[mode]) return;
    const items = override ? override : poolFor(src);
    if (!items.length) return toast(EMPTY_MSG[src.type] || '학습할 단어가 없어요.');
    if (mode === 'speak' && !SR) return say('이 브라우저는 말하기 연습을 지원하지 않아요.\n안드로이드 크롬, PC 크롬이나 엣지, 아이폰 사파리에서 써 보세요.');
    if ((mode === 'choice' || mode === 'rchoice' || mode === 'test' || mode === 'cloze') && allWords().length < 4) return toast(mode === 'test' ? '시험은 전체 단어가 4개 이상 있어야 해요.' : '4지선다는 전체 단어가 4개 이상 있어야 해요.');
    let q = shuffled(items.map(x => ({ w: x.w, catId: x.catId })));
    if (mode === 'test') q.forEach((x, i) => { const sp = /^[a-z][a-z'-]{0,13}$/i.test(x.w.word); x.t = ['choice', 'rchoice', sp ? 'spell' : 'choice'][i % 3]; });
    if (mode === 'test') q = shuffled(q);
    if (count > 0) q = q.slice(0, count);
    const dpool = poolFor(src).map(x => x.w);
    S = { active: true, finished: false, mode, src, count, queue: q, total: q.length, idx: 0, ok: 0, no: 0, wrong: new Map(), locked: false, answered: false, options: [], dpool: dpool.length >= 4 ? dpool : allWords().map(x => x.w), startN: (stats.days[dayKey()] || { n: 0 }).n, t0: Date.now(), log: [] };
    $('studyScreen').classList.add('open');
    document.body.classList.add('no-scroll');
    kbdHint(mode);
    if (mode === 'listen') startListen(); else renderQuestion();
    setTimeout(() => clPing(true), 0);
  }

  function renderQuestion() {
    if (S.idx >= S.queue.length) return finishSession();
    S.locked = false; S.answered = false;
    $('stProg').style.width = (S.idx / S.queue.length * 100) + '%';
    $('stCount').textContent = `${S.idx + 1}/${S.queue.length}`;
    const item = S.queue[S.idx];
    const md = S.mode === 'test' ? item.t : S.mode;
    if (md === 'card') renderCard(item);
    else if (md === 'choice') renderChoice(item, false);
    else if (md === 'rchoice') renderChoice(item, true);
    else if (md === 'cloze') { if (!renderCloze(item)) renderChoice(item, true); }
    else if (md === 'speak') renderSpeak(item);
    else renderTyping(item, md === 'dict');
    if (S.mode === 'test') { const qc = $('stBody').querySelector('.q-card'); if (qc) qc.insertAdjacentHTML('afterbegin', `<div class="exam-no">문제 ${S.idx + 1}</div>`); }
    $('stBody').scrollTop = 0;
  }
  const pronText = w => `${w.phonetic} ${w.koreanPron ? `[${w.koreanPron}]` : ''}`.trim();

  function recordResult(item, ok) {
    const w = item.w;
    grade(w, ok);
    recordStat(ok);
    if (!item.retry) { ok ? S.ok++ : S.no++; }
    if (!ok) {
      if (!S.wrong.has(w.id)) S.wrong.set(w.id, item);
      if (!item.retry && S.mode !== 'test') S.queue.push({ w, catId: item.catId, retry: true });
    }
    syncStorage(); clPing();
  }
  function nextQuestion() { S.idx++; renderQuestion(); }

  /* ----- 플래시카드 ----- */
  function renderCard(item) {
    const w = item.w;
    $('stBody').innerHTML = `
      <div class="q-wrap">
        <div class="sw-hint"><span class="no">← 아직 몰라요</span><span class="ok">알아요 →</span></div>
        <div class="swipe-area">
          <div class="swipe-wrap" id="swipeWrap" data-dir="">
            <div class="sw-badge ok">알아요</div><div class="sw-badge no">몰라요</div>
            <div class="fc-card-3d" id="fc3d">
              <div class="fc-face">
                <div class="q-word">${esc(w.word)}</div>
                <div class="q-pron">${esc(pronText(w))}</div>
                <button class="q-speak" data-act="speak" data-text="${esc(w.word)}" aria-label="발음 듣기">${IC.speaker}</button>
                <div class="fc-hint">카드를 눌러 뜻 보기</div>
              </div>
              <div class="fc-face fc-back">
                <div class="q-meaning">${esc(w.meaning)}</div>
                ${w.example ? `<div class="fc-ex"><span>${esc(w.example)}</span>${w.exampleKo ? `<small>${esc(w.exampleKo)}</small>` : ''}</div>` : ''}
                <div class="fc-hint">${w.box >= 1 ? esc(dueText(w)) : '새 단어'}</div>
              </div>
            </div>
          </div>
        </div>
        <div class="row q-foot">
          <button class="btn btn-bad" data-act="fly" data-dir="-1">아직 몰라요</button>
          <button class="btn btn-ok" data-act="fly" data-dir="1">알아요</button>
        </div>
      </div>`;
    bindSwipe();
    playAudio(w.word);
  }
  function bindSwipe() {
    const wrap = $('swipeWrap'); if (!wrap) return;
    let sx = 0, dx = 0, drag = false, moved = false;
    const reset = () => { wrap.style.transition = 'transform .2s'; wrap.style.transform = ''; wrap.dataset.dir = ''; };
    wrap.addEventListener('pointerdown', e => {
      if (S.locked || e.target.closest('[data-act="speak"]')) return;
      drag = true; moved = false; sx = e.clientX; dx = 0;
      wrap.style.transition = 'none';
      try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    });
    wrap.addEventListener('pointermove', e => {
      if (!drag) return;
      dx = e.clientX - sx;
      if (Math.abs(dx) > 8) moved = true;
      wrap.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
      wrap.dataset.dir = dx > 45 ? 'ok' : dx < -45 ? 'no' : '';
    });
    wrap.addEventListener('pointerup', () => {
      if (!drag) return;
      drag = false;
      if (!moved) { reset(); $('fc3d').classList.toggle('is-flipped'); return; }
      if (dx > 100) flyCard(1); else if (dx < -100) flyCard(-1); else reset();
    });
    wrap.addEventListener('pointercancel', () => { drag = false; reset(); });
  }
  function flyCard(dir) {
    const wrap = $('swipeWrap');
    if (!wrap || S.locked) return;
    S.locked = true;
    wrap.dataset.dir = dir > 0 ? 'ok' : 'no';
    wrap.style.transition = 'transform .28s ease, opacity .28s';
    wrap.style.transform = `translateX(${dir * 520}px) rotate(${dir * 22}deg)`;
    wrap.style.opacity = '0';
    const my = S.idx;
    setTimeout(() => {
      if (!S.active || S.idx !== my) return;
      recordResult(S.queue[S.idx], dir > 0);
      nextQuestion();
    }, 260);
  }
  ACTIONS.fly = el => flyCard(parseInt(el.dataset.dir, 10));

  /* ----- 4지선다 ----- */
  function makeOptions(cur, field) {
    const val = x => x[field];
    const seen = new Set([val(cur)]);
    const d = [];
    const take = list => {
      for (const w of shuffled(list)) {
        if (d.length === 3) break;
        if (w.id !== cur.id && val(w) && !seen.has(val(w))) { seen.add(val(w)); d.push(w); }
      }
    };
    take(S.dpool);
    if (d.length < 3) take(allWords().map(x => x.w));
    return shuffled([cur, ...d]);
  }
  function renderChoice(item, reverse) {
    const w = item.w;
    S.options = makeOptions(w, reverse ? 'word' : 'meaning');
    $('stBody').innerHTML = `
      <div class="q-wrap">
        <div class="q-card">
          ${reverse
            ? `<div class="q-label">이 뜻의 영어 단어는?</div><div class="q-meaning">${esc(w.meaning)}</div>`
            : `<div class="q-label">이 단어의 뜻은?</div><div class="q-word">${esc(w.word)}</div><div class="q-pron">${esc(pronText(w))}</div><button class="q-speak" data-act="speak" data-text="${esc(w.word)}" aria-label="발음 듣기">${IC.speaker}</button>`}
        </div>
        <div class="opts">${S.options.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}"><span class="opt-n">${i + 1}</span><span>${esc(reverse ? o.word : o.meaning)}</span></button>`).join('')}</div>
      </div>`;
    if (!reverse) playAudio(w.word);
  }
  const PRAISE = ['정답이에요', '좋아요', '잘했어요', '훌륭해요', '완벽해요'];
  ACTIONS.opt = el => {
    if (S.locked || !S.active) return;
    S.locked = true;
    const item = S.queue[S.idx];
    const chosen = S.options[parseInt(el.dataset.i, 10)];
    const ok = chosen.id === item.w.id;
    if (S.mode === 'test') {
      el.classList.add('picked'); $('stBody').querySelectorAll('.opt').forEach(b => { b.disabled = true; });
      S.log.push({ w: item.w, t: item.t, ok, your: item.t === 'rchoice' ? chosen.word : chosen.meaning });
      recordResult(item, ok); const my = S.idx;
      setTimeout(() => { if (S.active && S.idx === my) nextQuestion(); }, 280);
      return;
    }
    const btns = [...$('stBody').querySelectorAll('.opt')];
    btns.forEach(b => { b.disabled = true; });
    el.classList.add(ok ? 'correct' : 'wrong');
    if (!ok) { const ci = S.options.findIndex(o => o.id === item.w.id); if (btns[ci]) btns[ci].classList.add('correct'); }
    S.combo = ok ? (S.combo || 0) + 1 : 0;
    const qw = $('stBody').querySelector('.q-wrap');
    if (qw) {
      const bar = document.createElement('div');
      bar.className = 'ans-bar ' + (ok ? 'ok' : 'bad');
      bar.innerHTML = `<span class="ans-ic">${ok ? IC.tick : IC.x}</span><span class="ans-t"><b>${ok ? PRAISE[Math.floor(Math.random() * PRAISE.length)] : '정답은 이거예요'}</b><span>${esc(item.w.word)} · ${esc(item.w.meaning)}</span></span>${ok && S.combo >= 3 ? `<span class="ans-combo">${S.combo}연속 정답</span>` : ''}`;
      qw.appendChild(bar);
    }
    if (S.mode === 'rchoice' || S.mode === 'cloze') playAudio(item.w.word);
    recordResult(item, ok);
    const my = S.idx;
    setTimeout(() => { if (S.active && S.idx === my) nextQuestion(); }, ok ? 700 : 1600);
  };

  /* ----- 문장 빈칸 ----- */
  const reEsc = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function clozeOf(w) {
    const ex = String(w.example || ''), wd = String(w.word || '').trim(); if (!ex || !wd) return null;
    let m = ex.match(new RegExp(`\\b${reEsc(wd)}[a-z]*\\b`, 'i'));
    if (!m && wd.length >= 4 && !wd.includes(' ')) m = ex.match(new RegExp(`\\b${reEsc(wd.slice(0, Math.max(3, wd.length - 2)))}[a-z]*\\b`, 'i'));
    if (!m) return null;
    return { before: ex.slice(0, m.index), hit: m[0], after: ex.slice(m.index + m[0].length) };
  }
  function renderCloze(item) {
    const w = item.w, c = clozeOf(w); if (!c) return false;
    S.options = makeOptions(w, 'word');
    $('stBody').innerHTML = `
      <div class="q-wrap">
        <div class="q-card">
          <div class="q-label">빈칸에 들어갈 단어는?</div>
          <div class="cloze-s">${esc(c.before)}<span class="cloze-b">${'_'.repeat(Math.min(10, Math.max(4, c.hit.length)))}</span>${esc(c.after)}</div>
          ${w.exampleKo ? `<div class="q-sub">${esc(w.exampleKo)}</div>` : ''}
        </div>
        <div class="opts">${S.options.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}"><span class="opt-n">${i + 1}</span><span>${esc(o.word)}</span></button>`).join('')}</div>
      </div>`;
    return true;
  }

  /* ----- 말하기 ----- */
  let SPK = null;
  const spkNorm = x => String(x || '').toLowerCase().replace(/[^a-z' ]/g, '').replace(/\s+/g, ' ').trim();
  function renderSpeak(item) {
    const w = item.w; S.tries = 0;
    $('stBody').innerHTML = `
      <div class="q-wrap">
        <div class="q-card">
          <div class="q-label">단어를 소리 내어 말해 보세요</div>
          <div class="q-word">${esc(w.word)}</div>
          <div class="q-pron">${esc(pronText(w))}</div>
          <div class="q-sub">${esc(w.meaning)}</div>
          <button class="q-speak" data-act="speak" data-text="${esc(w.word)}" aria-label="먼저 듣기">${IC.speaker}</button>
        </div>
        <button class="mic-btn" id="micBtn" data-act="spk-go" aria-label="말하기 시작">${IC.mic}</button>
        <div class="spk-out" id="spkOut">버튼을 누르고 또박또박 말해 주세요</div>
        <div class="row q-foot"><button class="btn btn-soft" data-act="spk-skip">넘어가기</button></div>
      </div>`;
  }
  ACTIONS['spk-go'] = () => {
    if (!S.active || S.locked || !SR) return;
    const item = S.queue[S.idx], out = $('spkOut'), btn = $('micBtn');
    try { if (SPK) SPK.abort(); } catch (e) {}
    const r = new SR(); SPK = r; r.lang = 'en-US'; r.maxAlternatives = 5; r.interimResults = false;
    btn.classList.add('on'); out.textContent = '듣고 있어요...';
    let got = false;
    r.onresult = e => {
      got = true; const alts = [...e.results[0]].map(a => spkNorm(a.transcript)), target = spkNorm(item.w.word);
      const ok = alts.some(a => a === target || a.split(' ').includes(target) || (target.includes(' ') && a.includes(target)));
      S.tries = (S.tries || 0) + 1;
      if (ok) {
        S.locked = true; out.innerHTML = `<b class="ok">정확해요!</b> "${esc(alts[0])}"`; recordResult(item, true);
        const my = S.idx; setTimeout(() => { if (S.active && S.idx === my) nextQuestion(); }, 900);
      } else out.innerHTML = `<b class="bad">"${esc(alts[0] || '...')}"(으)로 들렸어요.</b> ${S.tries >= 3 ? '넘어가도 괜찮아요.' : '한 번 더 말해 볼까요?'}`;
    };
    r.onerror = e => { out.textContent = e.error === 'not-allowed' ? '마이크 사용을 허용해 주세요.' : e.error === 'no-speech' ? '소리가 들리지 않았어요. 다시 눌러 주세요.' : '인식하지 못했어요. 다시 눌러 주세요.'; };
    r.onend = () => { btn.classList.remove('on'); if (!got && out.textContent === '듣고 있어요...') out.textContent = '다시 눌러서 말해 주세요.'; };
    try { r.start(); } catch (e) { btn.classList.remove('on'); out.textContent = '마이크를 쓸 수 없어요.'; }
  };
  ACTIONS['spk-skip'] = () => { if (!S.active || S.locked) return; try { if (SPK) SPK.abort(); } catch (e) {} S.locked = true; recordResult(S.queue[S.idx], false); nextQuestion(); };

  /* ----- 스펠링 / 듣고 쓰기 ----- */
  const norm = s => String(s).toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?]+$/g, '').trim();
  function renderTyping(item, dictation) {
    const w = item.w;
    const hint = w.word.split('').map((ch, i) => ch === ' ' ? '  ' : (i === 0 ? ch : '_')).join(' ');
    $('stBody').innerHTML = `
      <div class="q-wrap">
        <div class="q-card">
          ${dictation
            ? `<div class="q-label">들리는 단어를 입력하세요</div><button class="q-speak big" data-act="speak" data-text="${esc(w.word)}" aria-label="다시 듣기">${IC.speaker}</button><div class="q-sub">눌러서 다시 들을 수 있어요</div>`
            : `<div class="q-label">이 뜻의 영어 단어를 쓰세요</div><div class="q-meaning">${esc(w.meaning)}</div><div class="q-hint">${esc(hint)}</div>`}
        </div>
        <input type="text" id="typeInput" class="type-input" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="여기에 입력">
        <div id="typeFeedback"></div>
        <div class="row q-foot">
          <button class="btn btn-soft" id="typeSkip" data-act="type-skip">모르겠어요</button>
          <button class="btn btn-primary" id="typeBtn" data-act="type-submit">확인</button>
        </div>
      </div>`;
    if (dictation) playAudio(w.word);
    setTimeout(() => { const i = $('typeInput'); if (i) i.focus(); }, 120);
  }
  function showTypeResult(ok, typed) {
    const item = S.queue[S.idx], w = item.w;
    S.answered = true;
    $('typeInput').disabled = true;
    $('typeFeedback').innerHTML = ok
      ? `<div class="fb ok"><span class="ans-ic">${IC.tick}</span><div>정답이에요! <b>${esc(w.word)}</b><div class="fb-sub">${esc(w.meaning)}</div></div></div>`
      : `<div class="fb bad"><span class="ans-ic">${IC.x}</span><div>정답은 <b>${esc(w.word)}</b> ${esc(w.phonetic)}<div class="fb-sub">${esc(w.meaning)}${w.example ? '<br>' + esc(w.example) : ''}${w.exampleKo ? '<br>' + esc(w.exampleKo) : ''}</div></div></div>`;
    $('typeBtn').textContent = '다음';
    $('typeSkip').style.display = 'none';
    playAudio(w.word);
    recordResult(item, ok);
  }
  ACTIONS['type-submit'] = () => {
    if (!S.active) return;
    if (S.answered) return nextQuestion();
    const typed = $('typeInput').value;
    if (!typed.trim()) return toast('답을 입력해 주세요.');
    if (S.mode === 'test') return examType(typed);
    showTypeResult(norm(typed) === norm(S.queue[S.idx].w.word), typed);
  };
  ACTIONS['type-skip'] = () => { if (!S.active || S.answered) return; if (S.mode === 'test') return examType(''); showTypeResult(false, ''); };
  function examType(typed) {
    const item = S.queue[S.idx], ok = !!typed && norm(typed) === norm(item.w.word);
    S.answered = true; S.log.push({ w: item.w, t: item.t, ok, your: typed.trim() });
    recordResult(item, ok); nextQuestion();
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && S.active && (S.mode === 'spell' || S.mode === 'dict' || (S.mode === 'test' && $('typeInput'))) && !S.finished) {
      if (e.target.id === 'typeInput' || S.answered) { e.preventDefault(); ACTIONS['type-submit'](); }
    }
  });

  /* ----- 결과 ----- */
  function finishSession() {
    if (S.mode === 'test') return finishExam();
    S.finished = true;
    kbdHint('');
    try { window.speechSynthesis.cancel(); } catch (e) {}
    $('stProg').style.width = '100%';
    $('stCount').textContent = '';
    const first = S.ok + S.no;
    const pct = first ? Math.round(S.ok / first * 100) : 0;
    const mood = pct >= 90 ? 'cheer' : pct >= 70 ? 'happy' : 'think';
    const title = pct >= 90 ? '완벽해요!' : pct >= 70 ? '아주 잘했어요' : pct >= 40 ? '조금만 더 하면 돼요' : '괜찮아요, 다시 해봐요';
    const st = streak();
    const goal = config.goal || 20;
    const todayN = (stats.days[dayKey()] || { n: 0 }).n;
    const goalHit = S.startN < goal && todayN >= goal;
    const wrongs = [...S.wrong.values()];
    const label = S.mode === 'card' ? '알아요' : '정답';
    $('stBody').innerHTML = `
      <div class="result">
        <div class="result-art">${MASCOT(mood)}</div>
        <h2>${title}</h2>
        <div class="score">${S.ok} / ${first}</div>
        <div class="result-stats"><div><b>${pct}%</b><span>${label}</span></div><div><b>${st}일</b><span>연속 학습</span></div><div class="${goalHit ? 'hit' : ''}"><b>${todayN}/${goal}</b><span>${goalHit ? '목표 달성!' : '오늘 목표'}</span></div></div>
        ${wrongs.length ? `<div class="card result-box"><b style="font-size:.95rem;">다시 볼 단어 ${wrongs.length}개</b>${wrongs.map(it => `<div class="wrong-item"><b>${esc(it.w.word)}</b><span>${esc(it.w.meaning)}</span><button class="w-speak" data-act="speak" data-text="${esc(it.w.word)}" aria-label="발음 듣기">${IC.speaker}</button></div>`).join('')}</div>` : '<div class="card result-box" style="text-align:center;">틀린 단어가 없어요. 대단해요!</div>'}
        <div class="row" style="margin-top:6px;">
          ${wrongs.length ? '<button class="btn btn-soft" data-act="retry-wrong">틀린 것만 다시</button>' : '<button class="btn btn-soft" data-act="again">한 번 더</button>'}
          <button class="btn btn-primary" data-act="exit-session">마치기</button>

  function voiceFor(lang) {
    try {
      const vs = window.speechSynthesis.getVoices(), L2 = lang.toLowerCase(), n = v => (v.lang || '').toLowerCase().replace('_', '-');
      const exact = vs.filter(v => n(v) === L2);
      if (L2 === 'en-us') return exact.find(v => /samantha|google us|aria|jenny|ava|allison|zira|natural|siri/i.test(v.name)) || exact[0] || null;
      return exact[0] || vs.find(v => n(v).startsWith(L2.slice(0, 2))) || null;
    } catch (e) { return null; }
  }
  function speak(text, lang) {
    return new Promise(res => {
      if (!('speechSynthesis' in window) || !text) return res();
      try { window.speechSynthesis.cancel(); } catch (e) {}

      u.lang = lang || 'en-US';
      u.rate = parseFloat(config.ttsRate) || 0.9;
      const v = voiceFor(u.lang); if (v) u.voice = v;
      let done = false;
      const fin = () => { if (!done) { done = true; res(); } };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 6000 + text.length * 160);
      window.speechSynthesis.speak(u);
    });
  }

  async function http(url, options = {}, timeoutMs = 15000) {

    let resp;
    try { resp = await fetch(url, { ...options, signal: ctrl.signal }); }
    catch (e) {
      clearTimeout(timer);
      if (e.name === 'AbortError') throw new ApiError(`응답 시간이 초과되었어요 (${Math.round(timeoutMs / 1000)}초). 네트워크를 확인하세요.`, 0);

    }
    clearTimeout(timer);
    const text = await resp.text();
    let body = null; try { body = JSON.parse(text); } catch (e) {}
    if (!resp.ok) {

  /* =========================================================
   * 영어사전 · 오늘의 단어 · 단어 시험지

  let dictView = null, dictTimer = 0, dictSeq = 0;
  function dictOpen(q) {
    dictView = null;
    openSheet('영어사전', `<div class="dsearch">${IC.search}<input type="search" id="dictQ" placeholder="영어 단어를 입력하세요 (예: happy, went)" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" value="${esc(q || '')}" oninput="dictType()" onkeydown="if(event.key==='Enter'){event.preventDefault();dictType(true);}"></div>
      <div id="dictOut" class="dict-out"><div class="dict-hint">뜻, 발음, 예문, 비슷한 단어를 바로 보여줘요.<br>앱에 들어 있는 사전이라 인터넷이 느려도 빨라요.</div></div>`);
    setTimeout(() => { const i = $('dictQ'); if (!i) return; if (q) dictType(true); else i.focus(); }, 60);
  }
  function dictType(now) {
    clearTimeout(dictTimer);
    dictTimer = setTimeout(dictSearch, now ? 0 : 160);
  }
  async function dictSearch() {
    const inp = $('dictQ'), out = $('dictOut'); if (!inp || !out) return;
    const raw = inp.value.trim(), q = raw.toLowerCase(), seq = ++dictSeq;
    if (!q) { out.innerHTML = '<div class="dict-hint">뜻, 발음, 예문, 비슷한 단어를 바로 보여줘요.</div>'; dictView = null; return; }
    if (!/^[a-z][a-z' .-]*$/i.test(q)) { out.innerHTML = '<div class="dict-hint">영어 단어로 찾아 주세요. 한글 뜻으로 찾을 때는 위의 번역 버튼을 써 보세요.</div>'; return; }
    const c = dictLetter(q), shard = c ? await dictShard(c) : {};
    const hit = await dictGet(q);
    if (seq !== dictSeq || !$('dictOut')) return;
    const keys = Object.keys(shard), stem = hit && hit.base ? hit.base : q;
    const sug = keys.filter(k => k !== q && k.startsWith(q) && !k.includes(' ') && Array.isArray(shard[k])).slice(0, 8);
    const phr = q.includes(' ') ? keys.filter(k => k !== q && k.startsWith(q) && Array.isArray(shard[k])).slice(0, 12) : keys.filter(k => k.startsWith(stem + ' ') && Array.isArray(shard[k])).sort((x, y) => (/ (a|b|one's|oneself|sb|sth)( |$)/.test(x) - / (a|b|one's|oneself|sb|sth)( |$)/.test(y)) || x.length - y.length).slice(0, 12);
    dictView = hit ? { ...hit, word: raw.replace(/\s+/g, ' ') } : null;
    let h = '';
    if (hit) {
      const syns = String(hit.synonyms || '').split(',').map(x => x.trim()).filter(Boolean);
      const pr = pronText(hit);
      const books = categories.map(b => `<option value="${esc(b.id)}"${b.id === currentCategoryId ? ' selected' : ''}>${esc(b.name)}</option>`).join('');
      h += `<div class="dict-card">
        <div class="dict-head"><div><b class="dict-w">${esc(dictView.word)}</b>${pr ? `<div class="q-pron">${esc(pr)}</div>` : ''}</div><button class="dict-sp" data-act="speak" data-text="${esc(dictView.word)}" aria-label="발음 듣기">${IC.speaker}</button></div>
        <div class="dict-m">${esc(hit.meaning)}</div>
        ${hit.base ? `<button class="link-btn" data-act="dict-go" data-word="${esc(hit.base)}">원형 ${esc(hit.base)} 보기</button>` : ''}
        ${hit.example ? `<div class="syn-ex"><div>${esc(hit.example)}</div>${hit.exampleKo ? `<small>${esc(hit.exampleKo)}</small>` : ''}</div>` : ''}
        ${syns.length ? `<h4 class="syn-h">비슷한 단어</h4><div class="syn-chips">${syns.map(x => `<button class="syn" data-act="dict-go" data-word="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}
        <div class="dict-add"><select id="dictBook" aria-label="담을 단어장">${books}<option value="__new">새 단어장: 사전에서 담은 단어</option></select><button class="btn btn-primary" data-act="dict-add">담기</button></div>
      </div>`;
    } else if (!sug.length && !phr.length) {
      h += `<div class="dict-none"><b>'${esc(raw)}'은(는) 내장 사전에 없어요.</b>${aiReady() ? '<button class="btn btn-soft" data-act="dict-ai">AI로 뜻 찾기</button>' : '<span class="muted">철자를 확인해 보세요.</span>'}</div>`;
    }
    if (phr.length) h += `<div class="dict-sug"><h4 class="syn-h">${q.includes(' ') ? '이어지는 숙어' : esc(stem) + ' 관련 숙어'}</h4>${phr.map(k => `<button class="dict-row" data-act="dict-go" data-word="${esc(k)}"><b>${esc(shard[k][0])}</b><span>${esc(shard[k][1])}</span></button>`).join('')}</div>`;
    if (sug.length) h += `<div class="dict-sug"><h4 class="syn-h">${hit ? '이런 단어도 있어요' : '혹시 이 단어인가요?'}</h4>${sug.map(k => `<button class="dict-row" data-act="dict-go" data-word="${esc(k)}"><b>${esc(shard[k][0])}</b><span>${esc(shard[k][1])}</span></button>`).join('')}</div>`;
    out.innerHTML = h;
  }
  ACTIONS['dict-open'] = el => dictOpen(el && el.dataset && el.dataset.word || '');
  ACTIONS['dict-go'] = el => { const i = $('dictQ'); if (!i) return dictOpen(el.dataset.word); i.value = el.dataset.word; dictType(true); const sh = document.querySelector('.sheet'); if (sh) sh.scrollTop = 0; };

  };

  /* =========================================================

  ACTIONS['teach-go'] = el => { currentCategoryId = el.dataset.id; closeSheet(); const f = ACTIONS[el.dataset.next]; setTimeout(() => f && f(), 60); };

  let PV = null;

  /* =========================================================
   * 단어장 공유 (링크 하나로 반 친구, 선생님과 나눠요)
   * ======================================================= */
  const b64u = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64u = t => { const s = atob(t.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  async function zipBytes(u8, inflate) {
    const cs = inflate ? new DecompressionStream('deflate-raw') : new CompressionStream('deflate-raw');
    return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer());
  }
  async function shareEncode(cat) {
    const raw = new TextEncoder().encode(JSON.stringify({ n: cat.name, w: cat.words.map(w => [w.word, w.meaning]) }));
    if (typeof CompressionStream === 'function') { try { return 'z' + b64u(await zipBytes(raw)); } catch (e) {} }
    return 'j' + b64u(raw);
  }
  async function shareDecode(code) {
    const t = String(code || ''), body = unb64u(t.slice(1));
    const raw = t[0] === 'z' ? await zipBytes(body, true) : body;
    const o = JSON.parse(new TextDecoder().decode(raw));
    const words = (Array.isArray(o.w) ? o.w : []).filter(a => Array.isArray(a) && a[0] && a[1]).slice(0, 2000).map(a => [String(a[0]).slice(0, 80), String(a[1]).slice(0, 200)]);
    if (!words.length) throw new Error('empty');
    return { name: String(o.n || '공유받은 단어장').slice(0, 40), words };
  }

  /* ----- 학생: 학습 요약 올리기 ----- */

  /* =========================================================
   * 보안문자 · 약관 · 개인정보 처리방침
   * ======================================================= */
  let capText = '', authFails = 0;
  const capRnd = n => { try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); } };
  function drawCaptcha() {
    const c = $('capCv'); if (!c) return;
    const W = c.width = 160, H = c.height = 52, x = c.getContext('2d'); if (!x) return;
    const set = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; capText = '';

    for (let i = 0; i < capText.length; i++) {
      x.save(); x.translate(20 + i * 28, 28 + capRnd(8) - 4); x.rotate((capRnd(60) - 30) / 100);

        ['제9조 (운영자의 의무)', '운영자는 관련 법령과 이 약관을 지키며 서비스를 안정적으로 제공하기 위해 노력합니다. 회원의 개인정보는 개인정보 처리방침에 따라 보호하며, 회원의 의견과 불만은 이메일로 받아 빠르게 처리합니다.'],
        ['제10조 (회원의 의무)', `회원은 다음 행위를 해서는 안 됩니다.

        ['제11조 (이용 제한)', '회원이 제10조를 어기면 운영자는 경고, 일시 정지, 계정 삭제 순으로 이용을 제한할 수 있습니다. 다만 서비스 운영에 심각한 피해를 주는 경우 바로 제한할 수 있습니다. 회원은 이용 제한에 대해 이메일로 이의를 제기할 수 있습니다.'],
        ['제12조 (회원 탈퇴)', '회원은 설정의 "계정과 데이터 삭제"로 언제든 탈퇴할 수 있습니다. 탈퇴하면 서버의 계정과 학습 데이터가 즉시 삭제되어 되돌릴 수 없으니, 필요하면 미리 백업 파일을 내려받아 두세요.'],
